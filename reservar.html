<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10223F">
<title>Reservar cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10223F;--paper:#F6F7F9;--line:#DDE2EA;--red:#C0272D;--blue:#2F6DB5;--mute:#5B6778}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4}
.pole{height:8px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
main{max-width:460px;margin:0 auto;padding:20px 20px 60px}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;margin:.5em 0 .2em;line-height:1.1}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:22px;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:14px;font-weight:600}
.btn:disabled{opacity:.6}
.mute{color:var(--mute)}
.hs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.h{padding:12px 6px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:600;color:inherit}
.h.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ok{background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:18px;margin-top:20px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--red);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

.booking-section{padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:20px 0}
.booking-section h2,.public-products h2{font-size:1.45rem;margin:0 0 10px}
.public-products{margin:28px 0}
.public-product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin:14px 0}
.public-product-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.public-product-card>img,.public-product-placeholder{width:100%;height:140px;object-fit:cover;background:#E8EDF5}
.public-product-placeholder{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.85rem}
.public-product-info{padding:12px;display:flex;flex-direction:column;gap:7px}
.public-product-info small{color:var(--mute)}
.public-product-info strong{font-size:1rem}
.public-product-info>span{font-weight:800;font-size:1.1rem}
.public-product-info p{font-size:.88rem;color:var(--mute);margin:0}
.public-product-info .btn{margin-top:auto;padding:10px}
.public-order-summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:18px}
.public-order-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.public-order-line span{flex:1}
.public-order-line button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px}
.public-order-total{font-weight:800;font-size:1.1rem;text-align:right}
\n@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="pole"></div><main id="app"><p class="mute">Cargando…</p></main><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="./src/pages/reservar.js"></script>
</body>
</html>
