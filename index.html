<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10223F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Barbería</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://gjqobyjebalbscgozvpa.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--ink:#10223F;--paper:#F6F7F9;--line:#DDE2EA;--red:#C0272D;--blue:#2F6DB5;--mute:#5B6778;--ok:#1F7A4D}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4}
.pole{height:8px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin:.6em 0 .2em;line-height:1.1}
h2{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.auth{max-width:420px;margin:0 auto;padding:24px 20px 40px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:600}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%;margin-top:20px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:8px}
.link.light{color:#fff}
.mute{color:var(--mute)}
.info{background:#DCE8F7;padding:12px;border-radius:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;position:relative;z-index:6}
nav.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.nav button{flex:1 0 auto;padding:16px 14px;background:none;border:0;font-weight:600;color:var(--mute);position:relative}
nav.nav button.on{color:var(--ink)}
nav.nav button.on::after{content:"";position:absolute;top:0;left:20%;right:20%;height:4px;background:var(--red)}
main{padding:16px 16px 100px;max-width:900px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;width:100%;text-align:left;color:inherit}
.row small{color:var(--mute)}
.row.off{opacity:.55}
.chip{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#E8EDF5;white-space:nowrap}
.chip.ATENDIDA{background:#DDF2E6;color:var(--ok)}
.chip.CONFIRMADA{background:#DCE8F7;color:var(--blue)}
.chip.CANCELADA,.chip.NO_ASISTIO{background:#F9DEDF;color:var(--red)}
.empty{color:var(--mute);padding:24px 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 14px}
.chk input{width:auto}
.dia{display:flex;gap:8px}
.dia .btn{width:52px;padding:0}
.cap{margin:10px 0 14px}
.cap::first-letter{text-transform:uppercase}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
dialog{border:0;border-radius:14px;padding:20px;width:min(520px,calc(100vw - 24px));max-height:92dvh;color:var(--ink)}
dialog::backdrop{background:rgba(16,34,63,.55)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media(min-width:900px){
 nav.nav{top:0;bottom:auto;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:84px}
 nav.nav button{text-align:left;padding:14px 24px;flex:none}
 nav.nav button.on::after{top:20%;bottom:20%;left:0;right:auto;width:4px;height:auto}
 .wrap{padding-left:220px}
 main{padding-bottom:40px}
}
.chip.PAGADA{background:#DDF2E6;color:var(--ok)}
.chip.ANULADA{background:#F9DEDF;color:var(--red)}
.ln{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:8px}
.ln2{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.tot{font-weight:800}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kp small{display:block;color:var(--mute)}.kp strong{font-size:1.15rem}
.hr{display:grid;grid-template-columns:1fr 100px 100px;gap:6px;align-items:center;margin-top:8px}
.hr .chk{margin:0}.hr input[type=time]{padding:8px 6px}
.hd{margin-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.hr2{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.hr2 input{padding:8px 6px}.hr2 small{color:var(--mute)}

.product-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:12px}
.product-tabs .btn{white-space:nowrap;flex:0 0 auto}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.product-card{padding:0;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.product-card-image{height:150px;background:#E8EDF5;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.85rem}
.product-card-image img{width:100%;height:100%;object-fit:cover}
.product-card-image{position:relative}.stock-badge{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:#E3F4EA;color:#1B7A43;box-shadow:0 1px 4px #0003}.stock-badge.bajo{background:#FFF1D6;color:#9A5B00}.stock-badge.agota{background:#FBE0E0;color:#B3261E}
.product-card-body{padding:12px;display:flex;flex-direction:column;gap:6px}
.product-card-body>strong{font-size:1.05rem}
.product-category{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.product-price{font-weight:800;font-size:1.12rem}
.product-card-body small{color:var(--mute)}
.product-photo-preview{height:150px;border-radius:10px;background:#E8EDF5;display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden}
.product-photo-preview img{width:100%;height:100%;object-fit:contain}
.order-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.order-head{display:flex;justify-content:space-between;gap:12px}
.order-head small{display:block;color:var(--mute);margin-top:3px}
.order-items{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.order-items span{background:#E8EDF5;border-radius:20px;padding:4px 9px;font-size:.85rem}
.order-card label{margin-top:8px}
\n .notif-bell{position:relative;font-size:1.35rem;padding:4px 8px}.notif-badge{position:absolute;top:-3px;right:-2px;background:#C0272D;color:#fff;border-radius:99px;font-size:.68rem;min-width:17px;height:17px;line-height:17px;text-align:center}.notif-panel{position:fixed;z-index:30;right:12px;top:68px;width:min(370px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 12px 35px #10223f30;border-radius:12px;padding:12px}.notif-panel[hidden]{display:none}.notif-panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}.notif-item{border-top:1px solid var(--line);padding:10px 4px}.notif-item p{margin:4px 0;color:var(--mute)}.notif-item small{color:var(--mute)}.notif-item.warning{border-left:4px solid #D89B28;padding-left:9px}.notif-item.danger{border-left:4px solid var(--red);padding-left:9px}

/* Panel independiente de pedidos de productos */
.orders-workspace{display:grid;gap:16px}
.orders-intro{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px;background:linear-gradient(120deg,#10223F,#24466f);color:#fff;border-radius:15px}
.orders-intro h2{color:#fff;margin:2px 0 6px}
.orders-intro p{margin:0;color:#dce7f5;font-size:.88rem;max-width:620px}
.orders-intro small{font-size:.7rem;letter-spacing:.09em;font-weight:700;color:#c8d8ee}
.orders-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.orders-kpis article{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.orders-kpis small{display:block;color:var(--mute);font-size:.76rem}
.orders-kpis strong{display:block;font-size:1.45rem;margin-top:3px}
.orders-toolbar{display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(3,minmax(130px,1fr));gap:9px;padding:13px;background:#fff;border:1px solid var(--line);border-radius:12px}
.orders-toolbar label{display:grid;gap:5px;margin:0;font-size:.75rem;color:var(--mute)}
.orders-toolbar input,.orders-toolbar select{min-width:0;padding:9px 10px}
.orders-list{display:grid;gap:12px}
.orders-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;display:grid;gap:12px}
.orders-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.orders-client{display:grid;gap:3px;min-width:0}
.orders-client strong{font-size:1rem}
.orders-client small,.orders-muted{color:var(--mute);font-size:.78rem}
.orders-total{text-align:right;white-space:nowrap;font-size:1.1rem;font-weight:800}
.orders-products{display:grid;gap:7px;padding:11px;background:#f7f9fc;border-radius:9px}
.orders-product-line{display:flex;justify-content:space-between;gap:12px;font-size:.85rem}
.orders-product-line span:last-child{white-space:nowrap;font-weight:700}
.orders-note{padding:9px 11px;border-left:3px solid #c7d7eb;background:#f8fafc;border-radius:5px;font-size:.82rem}
.orders-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.orders-actions select{width:auto;min-width:175px;padding:9px}
.orders-contact{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.orders-empty{padding:34px 18px;text-align:center;background:#fff;border:1px dashed #c8d2df;border-radius:13px;color:var(--mute)}
.orders-empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:5px}
.orders-count{font-size:.76rem;color:var(--mute)}
.orders-status{display:inline-flex;padding:4px 9px;border-radius:20px;font-size:.7rem;font-weight:800;background:#edf1f6;color:#42536a}
.orders-status.NUEVO{background:#fff0d6;color:#8b5a00}
.orders-status.EN_PREPARACION{background:#dce8f7;color:#245a9b}
.orders-status.LISTO{background:#e5e1fb;color:#5544a0}
.orders-status.ENTREGADO{background:#ddf2e6;color:#1f7a4d}
.orders-status.CANCELADO{background:#f9dedf;color:#a3222a}
@media(max-width:760px){.orders-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.orders-toolbar{grid-template-columns:1fr 1fr}.orders-toolbar label:first-child{grid-column:1/-1}.orders-intro{flex-direction:column}}
@media(max-width:420px){.orders-toolbar{grid-template-columns:1fr}.orders-toolbar label:first-child{grid-column:auto}.orders-item-head{flex-direction:column}.orders-total{text-align:left}.orders-actions{align-items:stretch}.orders-actions select{width:100%}}


/* Inventario patrimonial y comercial */
.inventory-tools{display:grid;grid-template-columns:minmax(200px,1fr) minmax(190px,.5fr) auto;gap:10px;align-items:end;margin:12px 0}
.inventory-tools .chk{margin:0 0 9px;white-space:nowrap}
.inventory-profit-preview{margin:12px 0;padding:12px 14px;background:#edf5ef;border:1px solid #cfe5d4;border-radius:10px;color:#245b37;display:grid;gap:4px;font-size:.88rem}
.inventory-profit-preview strong{font-size:.92rem}
.inventory-purchase-line{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(3,minmax(100px,.8fr)) 34px;gap:8px;align-items:end;padding:12px;margin:8px 0;background:#f7f9fc;border:1px solid var(--line);border-radius:10px}
.inventory-purchase-line label{margin:0;font-size:.76rem;color:var(--mute);display:grid;gap:5px}
.inventory-purchase-line input,.inventory-purchase-line select{min-width:0;padding:9px;font-size:.9rem}
.inventory-purchase-line .rm{padding:9px 10px}
.inventory-purchase-line .package-calc{color:#315c8a;font-size:.78rem;line-height:1.4}
@media(max-width:700px){.inventory-tools{grid-template-columns:1fr 1fr}.inventory-tools input{grid-column:1/-1}.inventory-tools .chk{grid-column:1/-1}.inventory-purchase-line{grid-template-columns:1fr 1fr;gap:7px}.inventory-purchase-line label:first-child{grid-column:1/-1}.inventory-purchase-line .package-calc{grid-column:1/-1}.inventory-purchase-line .rm{grid-column:2;justify-self:end}}


/* Inventario: interfaz profesional */
main:has(.inventory-shell){max-width:1480px;padding:26px 28px 110px}
.inventory-shell{display:grid;gap:18px;min-width:0}
.inventory-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:4px 0 2px}
.inventory-header h2{font-size:clamp(1.8rem,3vw,2.25rem);letter-spacing:-.045em}
.inventory-header p{margin:6px 0 0;color:var(--mute);font-size:.94rem}
.inventory-eyebrow{display:block;margin-bottom:6px;color:var(--blue);font-size:.68rem;font-weight:800;letter-spacing:.14em}
.inventory-primary{min-height:46px;white-space:nowrap;box-shadow:0 5px 14px #10223f18}
.inventory-primary span{font-size:1.2rem;margin-right:5px}
.inventory-shell .product-tabs{display:flex;gap:7px;overflow-x:auto;padding:5px 2px 12px;margin:0;border-bottom:1px solid var(--line);scrollbar-width:thin}
.inventory-shell .product-tabs .btn{padding:10px 15px;border-radius:9px;font-size:.86rem;font-weight:700}
.inventory-shell .product-tabs .btn:not(.sec){background:#244f80;box-shadow:0 3px 8px #10223f1a}
.inventory-overview{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(0,2fr);gap:12px}
.inventory-total{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px 22px;border-radius:15px;background:linear-gradient(125deg,#132b4b,#28517e);color:white;min-width:0}
.inventory-total .inventory-eyebrow{color:#c4d8f1}
.inventory-total>div>strong{display:block;font-size:clamp(1.65rem,3vw,2.15rem);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.inventory-total small{display:block;margin-top:5px;color:#d5e1ef;font-size:.77rem}
.inventory-total-icon{display:grid;place-items:center;flex:0 0 48px;height:48px;border-radius:14px;background:#ffffff1b;color:#fff;font-size:1.6rem}
.inventory-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.inventory-stats article{display:flex;align-items:center;gap:9px;min-width:0;padding:13px 11px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #10223f08}
.inventory-stats article>div{min-width:0}
.inventory-stats small{display:block;color:var(--mute);font-size:.72rem;line-height:1.2}
.inventory-stats strong{display:block;margin-top:5px;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.inventory-stat-icon{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:10px;font-weight:800}
.inventory-stat-icon.blue{background:#edf2fa;color:#315d91}.inventory-stat-icon.green{background:#e7f4ec;color:#26754a}.inventory-stat-icon.violet{background:#f0edfa;color:#6751a2}.inventory-stat-icon.amber{background:#fff3df;color:#99630e}.inventory-stat-icon.red{background:#fcebed;color:#b23c46}
.inventory-value-split{grid-column:1/-1;display:flex;justify-content:flex-end;gap:22px;padding:0 3px;color:var(--mute);font-size:.78rem}
.inventory-value-split strong{margin-left:5px;color:var(--ink);font-variant-numeric:tabular-nums}
.inventory-quick-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:13px}
.inventory-quick-actions>div:first-child strong,.inventory-quick-actions>div:first-child small{display:block}
.inventory-quick-actions>div:first-child strong{font-size:.9rem}
.inventory-quick-actions>div:first-child small{margin-top:3px;color:var(--mute);font-size:.76rem}
.inventory-quick-actions>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
.inventory-quick-actions .btn{padding:9px 13px;font-size:.82rem;border-radius:9px}
.inventory-list-panel{padding:17px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 2px 10px #10223f06}
.inventory-list-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
.inventory-list-heading h3{margin:0;font-size:1.08rem;letter-spacing:-.02em}
.inventory-list-heading p{margin:4px 0 0;color:var(--mute);font-size:.8rem}
.inventory-tools{display:grid;grid-template-columns:minmax(220px,1fr) minmax(190px,.4fr) auto;gap:10px;align-items:end;margin:0 0 14px;padding:12px;background:#f7f9fc;border:1px solid #e8edf4;border-radius:11px}
.inventory-search{display:flex;align-items:center;gap:8px;min-width:0;margin:0;color:var(--mute)}
.inventory-search>span{font-size:1.35rem}
.inventory-search input{min-width:0;min-height:42px;padding:9px 11px;border-radius:9px}
.inventory-filter{display:grid;gap:4px;margin:0;color:var(--mute);font-size:.74rem}
.inventory-filter select{min-width:0;min-height:42px;padding:8px 10px;border-radius:9px;font-size:.87rem}
.inventory-inactive{margin:0 0 9px;white-space:nowrap;font-size:.8rem}
.inventory-shell .product-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:13px;margin-top:0}
.inventory-shell .product-card{border-radius:13px;box-shadow:0 2px 9px #10223f08;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.inventory-shell .product-card:hover{transform:translateY(-2px);border-color:#b9c9dd;box-shadow:0 8px 20px #10223f12}
.inventory-shell .product-card-image{height:132px;background:linear-gradient(145deg,#f1f4f8,#e7edf5)}
.inventory-shell .product-card-body{padding:14px;gap:7px}
.inventory-shell .product-category{font-size:.67rem;letter-spacing:.08em;font-weight:800;color:#55708f}
.inventory-shell .product-card-body>strong{font-size:1.02rem;letter-spacing:-.015em}
.inventory-shell .product-price{font-size:1.18rem;color:#214f80}
.inventory-shell .product-card-body small{font-size:.75rem;line-height:1.4}
.inventory-shell .product-card .chip{align-self:flex-start;margin-top:3px;padding:4px 9px;font-size:.7rem}
.inventory-shell .product-card .chip.bien{background:#e7f4ec;color:#26754a}
.inventory-shell .product-card .chip.ojo{background:#fff3df;color:#99630e}
.inventory-shell .services-empty{padding:42px 22px;border:1px dashed #cbd5e2;border-radius:13px;background:#fafbfd}
.inventory-form{display:grid;gap:12px}
.inventory-form>h2{font-size:1.35rem}
.inventory-form-header{padding-bottom:13px;border-bottom:1px solid var(--line)}
.inventory-form-header h2{font-size:1.4rem}
.inventory-form-header p{margin:5px 0 0;color:var(--mute);font-size:.84rem}
.inventory-form label{font-size:.82rem;color:#42536a;margin:8px 0 5px}
.inventory-form input,.inventory-form select,.inventory-form textarea{border-radius:9px;border:1px solid #d5dde8;padding:10px 11px;font-size:.9rem}
.inventory-form .product-photo-preview{height:132px;border:1px dashed #cbd5e2;background:#f7f9fc}
.inventory-form .inventory-profit-preview{border-radius:11px;padding:13px 15px}
.inventory-form .acts{padding-top:7px;border-top:1px solid var(--line)}
@media(max-width:1050px){.inventory-overview{grid-template-columns:1fr}.inventory-stats{grid-template-columns:repeat(5,minmax(0,1fr))}}

.cash-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}
.cash-metric{display:flex;flex-direction:column;gap:5px;min-width:0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #10223f08}
.cash-metric-label{color:var(--mute);font-size:.76rem;font-weight:700}
.cash-metric strong{font-size:clamp(1.05rem,2vw,1.42rem);letter-spacing:-.03em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cash-metric small{color:var(--mute);font-size:.7rem;line-height:1.35}
.cash-metric-primary{background:#10223f;color:#fff;border-color:#10223f}
.cash-metric-primary .cash-metric-label,.cash-metric-primary small{color:#d7e1ef}
.cash-balance-panel,.cash-income-section,.cash-movements-section,.cash-open-panel,.cash-history{padding:17px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #10223f07}
.cash-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.cash-section-heading h3{margin:0;font-size:1.05rem;letter-spacing:-.02em}
.cash-section-heading .cash-eyebrow{margin-bottom:3px}
.cash-balance-badge,.cash-count{padding:5px 9px;border-radius:99px;background:#edf1f7;color:#52647b;font-size:.72rem;font-weight:700;white-space:nowrap}
.cash-balance-lines{display:grid;gap:0}
.cash-balance-lines>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid #edf0f4;font-size:.84rem}
.cash-balance-lines>div>span{color:var(--mute)}
.cash-balance-lines strong{font-variant-numeric:tabular-nums}
.cash-balance-total{margin-top:3px;padding-top:13px!important;border:0!important;font-weight:800;font-size:.96rem!important}
.cash-balance-total>span{color:var(--ink)!important}
.cash-balance-total strong{font-size:1.25rem}
.positive{color:#247348!important}.negative{color:#b23a42!important}
.cash-method-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.cash-method-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:13px;background:#f8f9fb;border:1px solid var(--line);border-radius:11px;text-align:left;color:var(--ink);transition:border-color .15s,background .15s}
.cash-method-card:hover{background:#f2f6fc;border-color:#aabbd1}
.cash-method-card>span{color:var(--mute);font-size:.76rem;font-weight:700}
.cash-method-card strong{font-size:1.08rem;font-variant-numeric:tabular-nums}
.cash-method-card small{color:var(--blue);font-size:.7rem;font-weight:700}
.cash-movement-toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 10px}
.cash-movement-toolbar label{display:grid;gap:5px;max-width:240px;margin:0;color:var(--mute);font-size:.74rem}
.cash-movement-toolbar select{min-height:39px;padding:7px 10px;border-radius:8px;font-size:.82rem}
.cash-movement-toolbar>span{color:var(--mute);font-size:.7rem;text-align:right}
.cash-movement-list{display:grid}
.cash-movement{display:flex;align-items:center;gap:11px;min-width:0;padding:11px 2px;border-bottom:1px solid #edf0f4}
.cash-movement:last-child{border-bottom:0}
.cash-movement-icon{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:11px;font-size:1.1rem;font-weight:800}
.cash-movement-icon.ingreso{background:#e5f4eb;color:#247348}
.cash-movement-icon.gasto{background:#fff0e8;color:#b65a32}
.cash-movement-icon.compra{background:#edf1f7;color:#52647b}
.cash-movement-info{display:grid;gap:2px;flex:1;min-width:0}
.cash-movement-info strong{font-size:.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cash-movement-info small{color:var(--mute);font-size:.69rem;overflow-wrap:anywhere}
.cash-movement-value{font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.cash-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;text-align:center;color:var(--mute)}
.cash-empty>span{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#edf1f7;color:#526985;font-size:1.3rem}
.cash-empty strong{color:var(--ink);font-size:.9rem}
.cash-empty p{max-width:44ch;margin:0;font-size:.76rem}
.cash-empty.compact{grid-column:1/-1;padding:14px}
.cash-actions{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 17px;background:#f0f4fa;border:1px solid #dce5f1;border-radius:13px}
.cash-actions>div:first-child{display:grid;gap:3px}
.cash-actions>div:first-child strong{font-size:.9rem}
.cash-actions>div:first-child small{color:var(--mute);font-size:.73rem;max-width:44ch}
.cash-actions>div:last-child{display:flex;gap:8px;flex-wrap:wrap}
.cash-close-button{background:#a52e36}
.cash-open-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.48fr);align-items:center;gap:24px;padding:22px}
.cash-open-copy{display:flex;align-items:flex-start;gap:13px}
.cash-panel-icon{display:grid;place-items:center;flex:0 0 45px;height:45px;border-radius:13px;background:#eaf1ff;color:#2f63ad;font-size:1.35rem}
.cash-open-copy h3{margin:0;font-size:1.12rem}
.cash-open-copy p{margin:6px 0 0;color:var(--mute);font-size:.82rem;max-width:55ch}
.cash-open-form{display:grid;grid-template-columns:1fr;gap:7px}
.cash-open-form label{margin:0;color:var(--mute);font-size:.77rem}
.cash-money-input{display:flex;align-items:center;gap:8px;padding-left:11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.cash-money-input span{color:var(--mute);font-weight:700}
.cash-money-input input{border:0;min-width:0;padding:10px 8px;box-shadow:none}
.cash-open-form .btn{width:100%;margin-top:3px}
.cash-history{padding:18px}
.cash-history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.cash-history-card{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fbfcfd}
.cash-history-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cash-history-top>strong{font-size:.83rem}
.cash-difference{padding:4px 7px;border-radius:99px;font-size:.7rem;font-weight:800;white-space:nowrap}
.cash-difference.balanced{background:#e5f4eb;color:#247348}
.cash-difference.surplus{background:#eaf1ff;color:#2f63ad}
.cash-difference.shortage{background:#fff0e8;color:#b23a42}
.cash-history-values{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.cash-history-values span{display:grid;gap:3px}
.cash-history-values small,.cash-history-note{color:var(--mute);font-size:.68rem}
.cash-history-values strong{font-size:.9rem;font-variant-numeric:tabular-nums}
.cash-history-note{display:block;margin-top:11px;overflow-wrap:anywhere}
.cash-close-form header{padding-bottom:13px;border-bottom:1px solid var(--line)}
.cash-close-form header h2{font-size:1.35rem}
.cash-close-form header p{margin:5px 0 0;color:var(--mute);font-size:.8rem}
.cash-close-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;padding:13px;border-radius:10px;background:#edf3fb;color:#425a79;font-size:.82rem}
.cash-close-summary strong{font-size:1.2rem;color:var(--ink)}
.cash-close-form>label{margin-top:13px}
.cash-close-difference{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:.78rem}
.cash-close-difference strong{font-size:.88rem}
.cash-close-form label small{color:var(--mute);font-weight:400}
.cash-close-hint{margin-top:12px;padding:10px;border-radius:8px;background:#f7f8fa;color:var(--mute);font-size:.72rem;line-height:1.45}
@media(max-width:760px){
 .cash-shell{gap:13px}
 .cash-header{align-items:flex-start}
 .cash-header p{font-size:.8rem}
 .cash-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .cash-metric{padding:12px}
 .cash-metric-primary{grid-column:1/-1}
 .cash-metric small{font-size:.66rem}
 .cash-balance-panel,.cash-income-section,.cash-movements-section,.cash-open-panel,.cash-history{padding:13px}
 .cash-actions{align-items:stretch;flex-direction:column}
 .cash-actions>div:last-child{display:grid;grid-template-columns:1fr 1fr}
 .cash-actions .btn{padding:11px 9px;font-size:.8rem}
 .cash-open-panel{grid-template-columns:1fr;gap:16px}
 .cash-open-form{grid-template-columns:1fr 1fr;align-items:end}
 .cash-open-form label{grid-column:1/-1}
 .cash-open-form .cash-money-input{grid-column:1}
 .cash-open-form .btn{grid-column:2}
 .cash-method-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:420px){
 .cash-header{flex-direction:column}
 .cash-metric strong{font-size:1.05rem}
 .cash-movement-toolbar{align-items:stretch;flex-direction:column}
 .cash-movement-toolbar label{max-width:none}
 .cash-movement-toolbar>span{text-align:left}
 .cash-movement{gap:8px}
 .cash-movement-icon{flex-basis:31px;height:31px}
 .cash-movement-value{font-size:.74rem}
 .cash-actions>div:last-child{grid-template-columns:1fr}
 .cash-open-form{grid-template-columns:1fr}
 .cash-open-form label,.cash-open-form .cash-money-input,.cash-open-form .btn{grid-column:1}
 .cash-history-grid{grid-template-columns:1fr}
}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Liquidaciones profesionales de barberos */
.liquidation-shell{display:grid;gap:18px;max-width:1180px;margin:0 auto}
.liquidation-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
.liquidation-header h2{margin:4px 0;font-size:1.55rem;letter-spacing:-.035em}
.liquidation-header p,.liquidation-section-head p{margin:4px 0 0;color:var(--mute);font-size:.82rem}
.liquidation-eyebrow{font-size:.64rem;font-weight:800;letter-spacing:.13em;color:#66809e}
.liquidation-actions{display:flex;gap:8px;flex-wrap:wrap}
.liquidation-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.liquidation-kpis article{display:grid;gap:7px;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 16px #1d35570a}
.liquidation-kpis small,.liquidation-kpis span{font-size:.72rem;color:var(--mute)}
.liquidation-kpis strong{font-size:1.35rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.liquidation-kpi-primary{background:#172f4d!important;color:#fff;border-color:#172f4d!important}
.liquidation-kpi-primary small,.liquidation-kpi-primary span{color:#d0dced}
.liquidation-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.liquidation-section-head h3{margin:0;font-size:1.05rem}
.liquidation-section-head>span{font-size:.72rem;color:var(--mute)}
.liquidation-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.liquidation-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 16px #1d35570a}
.liquidation-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.liquidation-card-head h3{margin:4px 0;font-size:1.02rem}
.liquidation-card-head small{color:var(--mute);font-size:.72rem}
.liquidation-status{padding:5px 9px;border-radius:99px;background:#fff4dc;color:#946314;font-size:.65rem;font-weight:800}
.liquidation-card-values{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0 12px}
.liquidation-card-values div{display:grid;gap:4px}
.liquidation-card-values small{font-size:.68rem;color:var(--mute)}
.liquidation-card-values strong{font-size:.96rem}
.liquidation-deduction{color:#b24c4c!important}
.liquidation-card-total{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:.78rem}
.liquidation-card-total strong{font-size:1.12rem}
.liquidation-empty,.liquidation-loading{padding:28px;border:1px dashed #cbd5e1;border-radius:14px;background:#fff;text-align:center;color:var(--mute);font-size:.82rem}
.liquidation-empty{grid-column:1/-1;display:grid;gap:6px}
.liquidation-empty strong{color:var(--ink);font-size:1rem}
.liquidation-footnote,.liquidation-hint{padding:11px 13px;border-radius:9px;background:#f3f6fa;color:#60718a;font-size:.72rem;line-height:1.5}
.liquidation-form,.liquidation-history{display:grid;gap:12px;min-width:min(560px,82vw)}
.liquidation-form header h2,.liquidation-history header h2{margin:4px 0;font-size:1.3rem}
.liquidation-form header p,.liquidation-history header p{margin:4px 0;color:var(--mute);font-size:.78rem}
.liquidation-breakdown{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 11px}
.liquidation-detail-row,.liquidation-history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.liquidation-detail-row:last-child,.liquidation-history-row:last-child{border-bottom:0}
.liquidation-detail-row>span,.liquidation-history-row>span{display:grid;gap:4px;min-width:0}
.liquidation-detail-row strong,.liquidation-history-row strong{font-size:.8rem}
.liquidation-detail-row small,.liquidation-history-row small{color:var(--mute);font-size:.68rem}
.liquidation-summary-line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.8rem}
.liquidation-net{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;border-radius:10px;background:#edf3fb;color:#3f5877;font-size:.78rem}
.liquidation-net strong{font-size:1.1rem;color:#172f4d}
.liquidation-history-row{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.liquidation-history-row:hover{background:#f7f9fc}
@media(max-width:720px){
 .liquidation-header{align-items:flex-start;flex-direction:column}
 .liquidation-actions{width:100%}
 .liquidation-actions .btn{flex:1}
 .liquidation-kpis{grid-template-columns:1fr 1fr}
 .liquidation-kpi-primary{grid-column:1/-1}
 .liquidation-grid{grid-template-columns:1fr}
 .liquidation-form,.liquidation-history{min-width:0}
}


/* Pedidos de compra a proveedores */
.supplier-orders-shell{max-width:1240px;margin:0 auto;display:grid;gap:18px}
.supplier-orders-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.supplier-orders-header h2{margin:4px 0;font-size:1.55rem;letter-spacing:-.035em}
.supplier-orders-header p,.supplier-orders-panel-head p{margin:4px 0 0;color:var(--mute);font-size:.82rem}
.supplier-orders-eyebrow{font-size:.63rem;font-weight:800;letter-spacing:.13em;color:#69809a}
.supplier-orders-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.supplier-orders-kpis article{display:grid;gap:6px;padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}
.supplier-orders-kpis small,.supplier-orders-kpis span{font-size:.7rem;color:var(--mute)}
.supplier-orders-kpis strong{font-size:1.35rem;letter-spacing:-.03em}
.supplier-orders-kpi-primary{background:#172f4d!important;border-color:#172f4d!important;color:#fff}
.supplier-orders-kpi-primary small,.supplier-orders-kpi-primary span{color:#d0dced}
.supplier-orders-panel{padding:18px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 20px #1d35570a}
.supplier-orders-panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.supplier-orders-panel-head h3{margin:0;font-size:1.05rem}
.supplier-orders-panel-head>span{font-size:.72rem;color:var(--mute)}
.supplier-orders-filters{display:grid;grid-template-columns:minmax(220px,1fr) 190px 170px;gap:9px;margin:16px 0}
.supplier-orders-filters input,.supplier-orders-filters select{min-width:0}
.supplier-orders-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.supplier-order-card{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fff}
.supplier-order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.supplier-order-top h3{margin:4px 0;font-size:1rem}
.supplier-order-top small{font-size:.7rem;color:var(--mute)}
.supplier-order-status{padding:5px 9px;border-radius:99px;font-size:.64rem;font-weight:800;background:#eef2f7;color:#596b82;white-space:nowrap}
.supplier-order-status.enviado{background:#eaf2ff;color:#315f9b}
.supplier-order-status.recibido{background:#e8f7ef;color:#26744b}
.supplier-order-status.cancelado{background:#fceeee;color:#a34c4c}
.supplier-order-preview{display:grid;gap:5px;margin:14px 0;padding:11px;border-radius:9px;background:#f7f9fc}
.supplier-order-preview span{display:flex;justify-content:space-between;gap:10px;font-size:.75rem;color:#4e6076}
.supplier-order-preview small{font-size:.68rem;color:var(--mute)}
.supplier-order-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;border-top:1px solid var(--line)}
.supplier-order-bottom>div{display:grid;gap:3px}
.supplier-order-bottom small{font-size:.68rem;color:var(--mute)}
.supplier-order-bottom strong{font-size:1rem}
.supplier-orders-empty,.supplier-orders-loading{padding:30px 18px;border:1px dashed #cbd5e1;border-radius:12px;text-align:center;color:var(--mute);font-size:.82rem}
.supplier-orders-empty strong{display:block;margin-bottom:5px;color:var(--ink);font-size:1rem}
.supplier-orders-empty p{margin:0 0 14px}
.supplier-order-form,.supplier-order-detail{display:grid;gap:12px;min-width:min(620px,84vw)}
.supplier-order-form header h2,.supplier-order-detail header h2{margin:4px 0;font-size:1.28rem}
.supplier-order-form header p,.supplier-order-detail header p{margin:4px 0;color:var(--mute);font-size:.78rem}
.supplier-order-line{display:grid;grid-template-columns:1.5fr .7fr .9fr 38px;align-items:end;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.supplier-order-line label,.supplier-receive-line label{font-size:.72rem}
.supplier-order-line input,.supplier-order-line select,.supplier-receive-line input{width:100%;min-width:0}
.supplier-order-line small{grid-column:1/-1;color:var(--mute);font-size:.68rem}
.supplier-order-total{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:10px;background:#edf3fb;color:#3f5877;font-size:.8rem}
.supplier-order-total strong{font-size:1.12rem;color:#172f4d}
.supplier-order-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border-radius:10px;background:#f6f8fb}
.supplier-order-meta span{display:grid;gap:4px}
.supplier-order-meta small,.supplier-order-items small{color:var(--mute);font-size:.68rem}
.supplier-order-meta strong{font-size:.82rem}
.supplier-order-items{display:grid;gap:0}
.supplier-order-items>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.supplier-order-items>div>span{display:grid;gap:4px}
.supplier-order-items strong{font-size:.8rem}
.supplier-order-notes,.supplier-order-received{padding:11px;border-radius:9px;background:#f6f8fb;color:#536780;font-size:.75rem;line-height:1.5}
.supplier-order-received{background:#e8f7ef;color:#26744b}
.supplier-order-detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.supplier-receive-lines{display:grid;gap:8px;max-height:230px;overflow:auto}
.supplier-receive-line{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:9px}
.supplier-receive-line>strong{grid-column:1/-1;font-size:.82rem}
@media(max-width:760px){
 .supplier-orders-header{align-items:flex-start;flex-direction:column}
 .supplier-orders-header .btn{width:100%}
 .supplier-orders-kpis{grid-template-columns:1fr 1fr}
 .supplier-orders-list{grid-template-columns:1fr}
 .supplier-orders-filters{grid-template-columns:1fr 1fr}
 .supplier-orders-filters input[type=search]{grid-column:1/-1}
 .supplier-order-form,.supplier-order-detail{min-width:0}
 .supplier-order-line{grid-template-columns:1fr 1fr}
 .supplier-order-line .sp-remove{grid-column:2;justify-self:end}
}


/* Centro de reportes gerenciales */
.reports-shell{max-width:1320px;margin:0 auto;display:grid;gap:18px}
.reports-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.reports-header h2{margin:4px 0;font-size:1.6rem;letter-spacing:-.04em}
.reports-header p{margin:4px 0 0;color:var(--mute);font-size:.82rem}
.reports-eyebrow{font-size:.63rem;font-weight:800;letter-spacing:.13em;color:#69809a}
.reports-badge{padding:8px 12px;border-radius:99px;background:#edf3fb;color:#365b85;font-size:.7rem;font-weight:800}
.reports-filter-panel{padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 18px #1d35570a}
.reports-filter-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr auto;align-items:end;gap:10px}
.reports-filter-grid label{display:grid;gap:6px;font-size:.72rem;color:#52657d;font-weight:700}
.reports-filter-grid input,.reports-filter-grid select{width:100%;min-width:0}
.reports-result{display:grid;gap:14px}
.reports-result-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.reports-result-head h3{margin:4px 0;font-size:1.12rem}
.reports-result-head p{margin:4px 0 0;color:var(--mute);font-size:.75rem}
.reports-export{display:flex;gap:8px;flex-wrap:wrap}
.reports-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.reports-summary article{display:grid;gap:6px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#fff}
.reports-summary small{font-size:.7rem;color:var(--mute)}
.reports-summary strong{font-size:1.18rem;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.reports-table-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.reports-table-head strong{font-size:.9rem}
.reports-table-head span,.reports-note{font-size:.7rem;color:var(--mute)}
.reports-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.reports-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:.74rem}
.reports-table th{padding:11px 12px;background:#f2f5f9;color:#4a5f78;text-align:left;font-size:.67rem;font-weight:800}
.reports-table td{padding:10px 12px;border-top:1px solid #edf0f4;color:#35465b}
.reports-table tbody tr:hover{background:#f9fbfd}
.reports-empty{padding:32px 18px;border:1px dashed #cbd5e1;border-radius:13px;background:#fff;text-align:center;color:var(--mute);font-size:.82rem}
.reports-empty strong{display:block;margin-bottom:6px;color:var(--ink);font-size:1rem}
.reports-empty p{margin:0}
.reports-note{margin:0}
@media(max-width:900px){.reports-filter-grid{grid-template-columns:1fr 1fr}.reports-filter-grid label:first-child{grid-column:1/-1}.reports-filter-grid button{width:100%}}
@media(max-width:680px){.reports-header,.reports-result-head{align-items:flex-start;flex-direction:column}.reports-badge{align-self:flex-start}.reports-filter-grid{grid-template-columns:1fr}.reports-filter-grid label:first-child{grid-column:auto}.reports-summary{grid-template-columns:1fr 1fr}.reports-export{width:100%}.reports-export .btn{flex:1}}



/* Navegación móvil lateral y perfil visible */
.bar{min-height:64px}
.bar-brand{display:flex;align-items:center;gap:12px;min-width:0}
.business-logo{height:44px;max-width:min(42vw,220px);display:block;object-fit:contain}
.bar-user{display:flex;align-items:center;gap:9px;min-width:0}
.bar-user-copy{display:grid;gap:1px;min-width:0}
.bar-user-copy strong{font-size:.82rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-user-copy small,.nav-profile small{font-size:.68rem;color:#d7e2f0;text-transform:capitalize}
.profile-avatar{position:relative;display:inline-grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:50%;overflow:hidden;background:#dce8f7;border:2px solid #ffffff70;color:#17385e}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-initials{display:none;place-items:center;width:100%;height:100%;font-size:.85rem;font-weight:800}
.profile-avatar.no-photo .profile-initials{display:grid}
.menu-toggle{display:none;border:1px solid #ffffff55;border-radius:9px;background:#ffffff12;color:#fff;width:42px;height:42px;font-size:1.35rem;line-height:1}
.nav-profile{display:flex;align-items:center;gap:11px;padding:12px;margin:0 10px 14px;border:1px solid var(--line);border-radius:12px;background:#f7f9fc}
.nav-profile .profile-avatar{border-color:#dce5f1;flex-basis:46px;width:46px;height:46px}
.nav-profile>span:last-child{display:grid;gap:3px;min-width:0}
.nav-profile strong{font-size:.84rem;overflow-wrap:anywhere}
.nav-profile small{color:var(--mute)}
.nav-backdrop{display:none}
@media(max-width:899px){
 .bar{position:sticky;top:0;z-index:15;padding:9px 12px;gap:8px}
 .menu-toggle{display:inline-grid;place-items:center;flex:0 0 42px}
 .business-logo{height:38px;max-width:34vw}
 .bar-user{gap:6px}
 .bar-user .profile-avatar{flex-basis:36px;width:36px;height:36px}
 .bar-user-copy{display:none}
 .bar-user .link{padding:7px 5px;font-size:.78rem}
 nav.nav{top:0;bottom:0;left:0;right:auto;width:min(84vw,310px);height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:2px;overflow-y:auto;overflow-x:hidden;padding:82px 12px max(20px,env(safe-area-inset-bottom));background:#fff;border:0;border-right:1px solid var(--line);box-shadow:12px 0 32px #10223f20;z-index:12;transform:translateX(-105%);transition:transform .22s ease}
 nav.nav.open{transform:translateX(0)}
 nav.nav .nav-profile{flex:0 0 auto;margin:0 0 12px}
 nav.nav button{flex:0 0 auto;width:100%;text-align:left;padding:13px 15px;border-radius:9px;background:transparent;color:var(--mute)}
 nav.nav button.on{background:#edf3fb;color:var(--ink)}
 nav.nav button.on::after{top:18%;bottom:18%;left:0;right:auto;width:4px;height:auto;border-radius:0 4px 4px 0}
 .nav-backdrop.show{display:block;position:fixed;inset:0;background:#0b1830a6;z-index:10}
 .wrap{padding-left:0}
 main{padding:16px 14px 28px}
 body.menu-open{overflow:hidden}
 #toast{bottom:18px}
}
@media(max-width:420px){
 .bar{padding-left:9px;padding-right:9px}
 .bar-brand{gap:8px}
 .business-logo{max-width:30vw;height:34px}
 .bar-user{gap:4px}
 .bar-user .link{font-size:.72rem;padding:7px 3px}
}

<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module">
import { sb } from "./src/lib/supabase.js";
import { esc, fecha, hora, bonito, traducir, waNum } from "./src/shared/utils.js";
import { crearConfigCatalogos } from "./src/config/catalogos.js";
import { crearModuloCatalogos } from "./src/modules/catalogos.js";
import { crearModuloProductos } from "./src/modules/productos.js";
import { crearModuloPedidos } from "./src/modules/pedidos.js";
import { crearModuloAgenda } from "./src/modules/agenda.js";
import { crearModuloEquipo } from "./src/modules/equipo.js";
import { crearModuloVentas } from "./src/modules/ventas.js";
import { crearModuloFinanzas } from "./src/modules/finanzas.js";
import { crearModuloInicio } from "./src/modules/inicio.js";
import { crearModuloAjustes } from "./src/modules/ajustes.js";
import { crearModuloNotificaciones } from "./src/modules/notificaciones.js";
import { crearModuloReportes } from "./src/modules/reportes.js";
import { crearModuloAcceso } from "./src/modules/acceso.js";
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const S={perfil:null,negocio:null,vista:'inicio',dia:fecha(new Date())};
const dinero=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:S.negocio?.moneda||'COP',maximumFractionDigits:0}).format(n||0);
const METODOS=['EFECTIVO','TRANSFERENCIA','TARJETA','NEQUI','DAVIPLATA'].map(m=>`<option value="${m}">${bonito(m)}</option>`).join('');
const fm=d=>new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const fila2=(a,b,c='')=>`<div class="ln2 ${c}"><span>${a}</span><span>${b}</span></div>`;
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',4000)}

const NOTIF=crearModuloNotificaciones({ $, sb, S, esc, toast });

/* ---------- Acceso ---------- */
/* ---------- Estructura ---------- */
const MENU=[['inicio','Inicio'],['agenda','Agenda'],['ventas','Ventas'],['clientes','Clientes'],['barberos','Barberos'],['servicios','Servicios'],['productos','Inventario'],['caja','Caja',1],['comisiones','Liquidaciones',1],['reportes','Reportes',1],['ajustes','Ajustes',2],['crearcliente','Crear cliente',3],['miscom','Mis comisiones',3],['miperfil','Mi perfil',3]];
const { pantallaAuth, cargar, aviso } = crearModuloAcceso({ $, app, sb, S, esc, traducir, toast, waNum, shell });
function avatarPerfil(){
 const nombre=String(S.perfil.nombre||'Usuario').trim(),iniciales=nombre.split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'U';
 const foto=S.perfil.foto_url;
 return `<span class="profile-avatar ${foto?'':'no-photo'}">${foto?`<img src="${esc(foto)}" alt="Foto de ${esc(nombre)}" onerror="this.remove();this.parentElement.classList.add('no-photo')">`:''}<span class="profile-initials">${esc(iniciales)}</span></span>`;
}
function shell(){
 const avatar=avatarPerfil(),nombre=esc(S.perfil.nombre||'Usuario'),rol=esc(String(S.perfil.rol||'').toLowerCase());
 app.innerHTML=`<div class="pole"></div><div class="bar"><div class="bar-brand"><button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>${S.negocio.logo_url?`<img src="${esc(S.negocio.logo_url)}" alt="${esc(S.negocio.nombre)}" class="business-logo">`:`<strong>${esc(S.negocio.nombre)}</strong>`}</div><span class="bar-user">${avatar}<span class="bar-user-copy"><strong>${nombre}</strong><small>${rol}</small></span><button type="button" class="link light notif-bell" id="campana-notificaciones" aria-label="Notificaciones">♢</button><button class="link light" id="out">Salir</button></span></div>
 <div class="nav-backdrop" id="nav-backdrop"></div><nav class="nav" aria-label="Menú principal"><div class="nav-profile">${avatar}<span><strong>${nombre}</strong><small>${rol}</small></span></div>${(S.perfil.rol==='BARBERO'?MENU.filter(m=>['inicio','agenda','crearcliente','ventas','miscom','miperfil'].includes(m[0])):MENU.filter(m=>!m[2]||(m[2]===2?ADM.includes(S.perfil.rol):ADM.includes(S.perfil.rol)))).map(([k,l])=>`<button data-v="${k}">${k==='ventas'&&S.perfil.rol==='BARBERO'?'Cobrar servicios':k==='agenda'&&S.perfil.rol==='BARBERO'?'Mi agenda':l}</button>`).join('')}</nav><div class="wrap">${aviso()}<main id="main"></main></div>`;
 $('#out').onclick=()=>{NOTIF.detener();sb.auth.signOut()};
 const nav=$('nav.nav'),backdrop=$('#nav-backdrop'),toggle=$('#menu-toggle');
 const cerrarMenu=()=>{nav.classList.remove('open');backdrop.classList.remove('show');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Abrir menú');document.body.classList.remove('menu-open')};
 toggle.onclick=()=>{const abierto=nav.classList.toggle('open');backdrop.classList.toggle('show',abierto);toggle.setAttribute('aria-expanded',String(abierto));toggle.setAttribute('aria-label',abierto?'Cerrar menú':'Abrir menú');document.body.classList.toggle('menu-open',abierto)};
 backdrop.onclick=cerrarMenu;
 NOTIF.iniciar();
 document.querySelectorAll('nav.nav button[data-v]').forEach(b=>b.onclick=()=>{S.vista=b.dataset.v;cerrarMenu();ir()});
 ir();
}
function ir(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));({inicio,agenda,ventas,productos,pedidos:pedidosProductos,caja,comisiones,reportes,ajustes,crearcliente:()=>crud('clientes'),miscom:misComisiones,miperfil:miPerfil}[S.vista]||(()=>crud(S.vista)))()}

/* ---------- Clientes, barberos y servicios ---------- */
const ADM=['ADMINISTRADOR','SUPERVISOR'];
const soloMio=()=>S.perfil.rol==='BARBERO'&&!!S.perfil.barbero_id,mio=q=>soloMio()?q.eq('barbero_id',S.perfil.barbero_id):q;
const { horarios, equipo, miPerfil } = crearModuloEquipo({ $, dlg, sb, S, esc, bonito, toast });
const { ajustes } = crearModuloAjustes({ $, sb, S, esc, toast, equipo, ir, notificaciones: NOTIF });
const CFG=crearConfigCatalogos(ADM,dinero);
const { crud } = crearModuloCatalogos({ $, app, dlg, sb, S, CFG, esc, bonito, traducir, toast, horarios });
const { productos } = crearModuloProductos({ $, dlg, sb, S, esc, dinero, traducir, toast });
const { pedidos: pedidosProductos } = crearModuloPedidos({ $, dlg, sb, S, esc, dinero, toast });
const { ventas, nuevaVenta } = crearModuloVentas({ $, dlg, sb, S, esc, dinero, hora, bonito, traducir, toast, ADM, METODOS, mio });
const { caja, comisiones, misComisiones } = crearModuloFinanzas({ $, dlg, sb, S, esc, dinero, hora, bonito, toast, METODOS, fila2, fm });
const { agenda, porConfirmar } = crearModuloAgenda({ $, app, dlg, sb, S, esc, hora, bonito, fecha, traducir, toast, nuevaVenta, mio, ir });
const { reportes } = crearModuloReportes({ $, sb, S, esc, dinero, toast });
const { inicio } = crearModuloInicio({ $, sb, S, esc, dinero, hora, fecha, bonito, toast, ADM, mio, fila2, porConfirmar });
/* ---------- Agenda ---------- */

/* ---------- Horarios ---------- */
/* ---------- Ventas y pagos ---------- */
/* ---------- Caja, gastos y comisiones ---------- */
/* ---------- Recordatorio por WhatsApp ---------- */
/* ---------- Detalle de cobros y panel gerencial ---------- */
/* ---------- Inicio ---------- */
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')pantallaAuth()});
(async()=>{const{data:{session}}=await sb.auth.getSession();session?cargar():pantallaAuth()})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
