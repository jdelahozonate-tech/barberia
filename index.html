<style>
:root{--ink:#10223F;--paper:#F6F7F9;--line:#DDE2EA;--red:#C0272D;--blue:#2F6DB5;--mute:#5B6778;--ok:#1F7A4D}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4}
.pole{height:8px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin:.6em 0 .2em;line-height:1.1}
h2{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.auth{max-width:420px;margin:0 auto;padding:24px 20px 40px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}

button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:600}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%;margin-top:20px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:8px}
.link.light{color:#fff}
.mute{color:var(--mute)}
.info{background:#DCE8F7;padding:12px;border-radius:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;position:relative;z-index:6}
nav.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.nav button{flex:1 0 auto;padding:16px 14px;background:none;border:0;font-weight:600;color:var(--mute);position:relative}
nav.nav button.on{color:var(--ink)}
nav.nav button.on::after{content:"";position:absolute;top:0;left:20%;right:20%;height:4px;background:var(--red)}
main{padding:16px 16px 100px;max-width:900px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;width:100%;text-align:left;color:inherit}
.row small{color:var(--mute)}
.row.off{opacity:.55}
.chip{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#E8EDF5;white-space:nowrap}
.chip.ATENDIDA{background:#DDF2E6;color:var(--ok)}
.chip.CONFIRMADA{background:#DCE8F7;color:var(--blue)}
.chip.CANCELADA,.chip.NO_ASISTIO{background:#F9DEDF;color:var(--red)}
.empty{color:var(--mute);padding:24px 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 14px}
.chk input{width:auto}
.dia{display:flex;gap:8px}
.dia .btn{width:52px;padding:0}
.cap{margin:10px 0 14px}

.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media(min-width:900px){
 nav.nav{top:0;bottom:auto;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:84px}
 nav.nav button{text-align:left;padding:14px 24px;flex:none}
 nav.nav button.on::after{top:20%;bottom:20%;left:0;right:auto;width:4px;height:auto}

}

.ln{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:8px}

.order-items span{background:#E8EDF5;border-radius:20px;padding:4px 9px;font-size:.85rem}

\n .notif-bell{position:relative;font-size:1.35rem;padding:4px 8px}.notif-badge{position:absolute;top:-3px;right:-2px;background:#C0272D;color:#fff;border-radius:99px;font-size:.68rem;min-width:17px;height:17px;line-height:17px;text-align:center}.notif-panel{position:fixed;z-index:30;right:12px;top:68px;width:min(370px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 12px 35px #10223f30;border-radius:12px;padding:12px}.notif-panel[hidden]{display:none}.notif-panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}.notif-item{border-top:1px solid var(--line);padding:10px 4px}.notif-item p{margin:4px 0;color:var(--mute)}.notif-item small{color:var(--mute)}.notif-item.warning{border-left:4px solid #D89B28;padding-left:9px}.notif-item.danger{border-left:4px solid var(--red);padding-left:9px}

n:0;font-size:.78rem;color:var(--mute)}.agenda-filtros select{min-width:135px;min-height:42px;padding:8px 30px 8px 10px;border-radius:9px;font-size:.9rem}.agenda-contenido{min-width:0}.agenda-dia-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.agenda-dia-titulo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.agenda-dia-titulo h3{margin:2px 0 0;font-size:1.12rem;text-transform:capitalize}.agenda-total-dia{background:#edf1f7;color:#344b6b;padding:6px 11px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}.agenda-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px;padding-top:14px}.agenda-cita{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;min-width:0;padding:13px 14px;background:#fff;border:1px solid var(--line);border-left:4px solid #9aa8ba;border-radius:11px;text-align:left;color:var(--ink);transition:box-shadow .15s,border-color .15s}.agenda-cita:hover{box-shadow:0 5px 16px #10223f12;border-color:#b7c4d5}.agenda-cita-hora{font-size:.76rem;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}.agenda-cita>strong{font-size:.98rem;overflow-wrap:anywhere}.agenda-cita-detalle{font-size:.82rem;color:var(--mute);overflow-wrap:anywhere}.agenda-cita .chip{margin-top:3px}.agenda-cita:has(.chip.PENDIENTE){border-left-color:#d69a31}.agenda-cita:has(.chip.CONFIRMADA){border-left-color:#4779d1}.agenda-cita:has(.chip.ATENDIDA){border-left-color:#299653}.agenda-cita:has(.chip.CANCELADA),.agenda-cita:has(.chip.NO_ASISTIO){border-left-color:#c65b60}.agenda-vacio{display:flex;align-items:center;flex-direction:column;gap:8px;text-align:center;padding:34px 16px;color:var(--mute)}.agenda-vacio-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#edf1f7;color:#526985;font-size:1.5rem}.agenda-vacio strong{color:var(--ink);font-size:1rem}.agenda-vacio .btn{margin-top:7px}.agenda-semana-scroll,.agenda-mes-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:5px}.agenda-semana{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:9px;min-width:1050px}.agenda-columna{min-width:0;min-height:230px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px}.agenda-columna.es-hoy{border-color:#7c9cc8;box-shadow:inset 0 3px 0 var(--blue)}.agenda-columna-head{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 10px;border-bottom:1px solid var(--line);text-transform:capitalize}.agenda-columna-head span{font-size:.78rem;color:var(--mute);font-weight:700}.agenda-columna-head strong{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#edf1f7;font-size:.9rem}.agenda-columna.es-hoy .agenda-columna-head strong{background:var(--ink);color:#fff}.agenda-columna-citas{display:grid;gap:7px;padding-top:9px}.agenda-columna .agenda-cita{padding:9px;gap:4px}.agenda-columna .agenda-cita>strong{font-size:.83rem}.agenda-columna .agenda-cita-detalle{font-size:.72rem}.agenda-columna .chip{font-size:.68rem;padding:2px 7px}.agenda-sin-citas{padding:10px 2px;color:#929baa;font-size:.76rem;text-align:center}.agenda-mes{min-width:680px;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.agenda-mes-dias,.agenda-mes-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.agenda-mes-dias{background:#f0f3f8;border-bottom:1px solid var(--line)}.agenda-mes-dias span{text-align:center;padding:10px 4px;color:var(--mute);font-size:.76rem;font-weight:800}.agenda-mes-celda{min-width:0;min-height:100px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.agenda-mes-celda:nth-child(7n){border-right:0}.agenda-mes-celda.fuera-mes{background:#f8f9fb}.agenda-mes-celda.fuera-mes .agenda-dia-numero{color:#a3aab5}.agenda-mes-celda.es-seleccionado{background:#f2f6fc;box-shadow:inset 0 0 0 2px #7c9cc8}.agenda-dia-numero{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.82rem;font-weight:800;padding:3px 6px;border-radius:6px}.agenda-dia-numero:hover{background:#e5ebf4}.agenda-mes-citas{display:grid;gap:3px;margin-top:4px}.agenda-mes-cita{display:flex;gap:4px;align-items:center;min-width:0;width:100%;padding:4px 5px;border:0;border-radius:5px;background:#eaf1ff;color:#244f88;text-align:left;font-size:.68rem}.agenda-mes-cita time{font-weight:800;white-space:nowrap}.agenda-mes-cita span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agenda-mes-citas>small{font-size:.66rem;color:var(--mute);padding-left:4px}.agenda-leyenda{display:flex;flex-wrap:wrap;gap:12px 18px;color:var(--mute);font-size:.75rem;padding:0 3px}.agenda-leyenda span{display:flex;align-items:center;gap:6px}.agenda-leyenda i{width:8px;height:8px;border-radius:50%;background:#d69a31}.agenda-leyenda i.confirmada{background:#4779d1}.agenda-leyenda i.atendida{background:#299653}.agenda-leyenda i.cancelada{background:#c65b60}
@media(max-width:700px){main{padding:12px 12px calc(94px + env(safe-area-inset-bottom))}.agenda-shell{gap:13px}.agenda-header{align-items:flex-start}.agenda-header p{font-size:.83rem;max-width:34ch}.agenda-nueva{padding:11px 12px;font-size:.86rem;min-height:42px}.agenda-resumen{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.agenda-metrica{padding:10px;gap:8px}.agenda-metrica-icon{flex-basis:33px;height:33px}.agenda-metrica small{font-size:.7rem}.agenda-metrica strong{font-size:1.2rem}.agenda-toolbar{padding:11px;gap:12px}.agenda-navegacion{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:7px}.agenda-navegacion input{width:100%;min-width:0}.agenda-flecha{width:40px;height:42px}.agenda-rango{grid-column:1/-1;margin:0;font-size:.9rem;text-align:center}.agenda-filtros{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.agenda-filtros select{width:100%;min-width:0}.agenda-dia-panel{padding:13px}.agenda-lista{grid-template-columns:1fr}.agenda-semana{min-width:1050px}.agenda-mes{min-width:640px}.agenda-mes-celda{min-height:76px;padding:4px}.agenda-mes-dias span{padding:8px 2px;font-size:.68rem}.agenda-mes-cita{font-size:.62rem;padding:3px}.agenda-leyenda{gap:9px 13px;font-size:.69rem}}

<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module">
import { sb } from "./src/lib/supabase.js";
import { esc, fecha, hora, bonito, traducir, waNum } from "./src/shared/utils.js";
import { crearConfigCatalogos } from "./src/config/catalogos.js";
import { crearModuloCatalogos } from "./src/modules/catalogos.js";
import { crearModuloProductos } from "./src/modules/productos.js";
import { crearModuloAgenda } from "./src/modules/agenda.js";
import { crearModuloEquipo } from "./src/modules/equipo.js";
import { crearModuloVentas } from "./src/modules/ventas.js";
import { crearModuloFinanzas } from "./src/modules/finanzas.js";
import { crearModuloInicio } from "./src/modules/inicio.js";
import { crearModuloAjustes } from "./src/modules/ajustes.js";
import { crearModuloNotificaciones } from "./src/modules/notificaciones.js";
import { crearModuloAcceso } from "./src/modules/acceso.js";
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const S={perfil:null,negocio:null,vista:'inicio',dia:fecha(new Date())};
const dinero=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:S.negocio?.moneda||'COP',maximumFractionDigits:0}).format(n||0);
const METODOS=['EFECTIVO','TRANSFERENCIA','TARJETA','NEQUI','DAVIPLATA'].map(m=>`<option value="${m}">${bonito(m)}</option>`).join('');
const fm=d=>new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const fila2=(a,b,c='')=>`<div class="ln2 ${c}"><span>${a}</span><span>${b}</span></div>`;
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',4000)}

const NOTIF=crearModuloNotificaciones({ $, sb, S, esc, toast });

/* ---------- Acceso ---------- */
/* ---------- Estructura ---------- */
const MENU=[['inicio','Inicio'],['agenda','Agenda'],['ventas','Ventas'],['pedidos','Pedidos'],['clientes','Clientes'],['barberos','Barberos'],['servicios','Servicios'],['productos','Productos'],['caja','Caja',1],['comisiones','Comisiones',1],['ajustes','Ajustes',2],['miscom','Mis comisiones',3],['miperfil','Mi perfil',3]];
const { pantallaAuth, cargar, aviso } = crearModuloAcceso({ $, app, sb, S, esc, traducir, toast, waNum, shell });
function shell(){
 app.innerHTML=`<div class="pole"></div><div class="bar">${S.negocio.logo_url?`<img src="${esc(S.negocio.logo_url)}" alt="${esc(S.negocio.nombre)}" style="height:44px;display:block">`:`<strong>${esc(S.negocio.nombre)}</strong>`}<span><small>${esc(S.perfil.nombre)}, ${S.perfil.rol.toLowerCase()}</small> <button type="button" class="link light notif-bell" id="campana-notificaciones" aria-label="Notificaciones">♢</button> <button class="link light" id="out">Salir</button></span></div>
 <nav class="nav">${MENU.filter(m=>!m[2]||(m[2]===3?S.perfil.rol==='BARBERO':m[2]===2?ADM.includes(S.perfil.rol):ADM.includes(S.perfil.rol))).map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</nav><div class="wrap">${aviso()}<main id="main"></main></div>`;
 $('#out').onclick=()=>{NOTIF.detener();sb.auth.signOut()};
 NOTIF.iniciar();
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.vista=b.dataset.v;ir()});
 ir();
}
function ir(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));({inicio,agenda,ventas,productos,pedidos:pedidosProductos,caja,comisiones,ajustes,miscom:misComisiones,miperfil:miPerfil}[S.vista]||(()=>crud(S.vista)))()}

/* ---------- Clientes, barberos y servicios ---------- */
const ADM=['ADMINISTRADOR','SUPERVISOR'];
