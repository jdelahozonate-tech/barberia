<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10223F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Barbería</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10223F;--paper:#F6F7F9;--line:#DDE2EA;--red:#C0272D;--blue:#2F6DB5;--mute:#5B6778;--ok:#1F7A4D}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4}
.pole{height:8px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin:.6em 0 .2em;line-height:1.1}
h2{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.auth{max-width:420px;margin:0 auto;padding:24px 20px 40px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:600}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%;margin-top:20px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:8px}
.link.light{color:#fff}
.mute{color:var(--mute)}
.info{background:#DCE8F7;padding:12px;border-radius:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;position:relative;z-index:6}
nav.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.nav button{flex:1 0 auto;padding:16px 14px;background:none;border:0;font-weight:600;color:var(--mute);position:relative}
nav.nav button.on{color:var(--ink)}
nav.nav button.on::after{content:"";position:absolute;top:0;left:20%;right:20%;height:4px;background:var(--red)}
main{padding:16px 16px 100px;max-width:900px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;width:100%;text-align:left;color:inherit}
.row small{color:var(--mute)}
.row.off{opacity:.55}
.chip{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#E8EDF5;white-space:nowrap}
.chip.ATENDIDA{background:#DDF2E6;color:var(--ok)}
.chip.CONFIRMADA{background:#DCE8F7;color:var(--blue)}
.chip.CANCELADA,.chip.NO_ASISTIO{background:#F9DEDF;color:var(--red)}
.empty{color:var(--mute);padding:24px 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 14px}
.chk input{width:auto}
.dia{display:flex;gap:8px}
.dia .btn{width:52px;padding:0}
.cap{margin:10px 0 14px}
.cap::first-letter{text-transform:uppercase}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
dialog{border:0;border-radius:14px;padding:20px;width:min(520px,calc(100vw - 24px));max-height:92dvh;color:var(--ink)}
dialog::backdrop{background:rgba(16,34,63,.55)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media(min-width:900px){
 nav.nav{top:0;bottom:auto;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:84px}
 nav.nav button{text-align:left;padding:14px 24px;flex:none}
 nav.nav button.on::after{top:20%;bottom:20%;left:0;right:auto;width:4px;height:auto}
 .wrap{padding-left:220px}
 main{padding-bottom:40px}
}
.chip.PAGADA{background:#DDF2E6;color:var(--ok)}
.chip.ANULADA{background:#F9DEDF;color:var(--red)}
.ln{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:8px}
.ln2{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.tot{font-weight:800}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kp small{display:block;color:var(--mute)}.kp strong{font-size:1.15rem}
.hr{display:grid;grid-template-columns:1fr 100px 100px;gap:6px;align-items:center;margin-top:8px}
.hr .chk{margin:0}.hr input[type=time]{padding:8px 6px}
.hd{margin-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.hr2{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.hr2 input{padding:8px 6px}.hr2 small{color:var(--mute)}

.product-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin-bottom:12px}
.product-tabs .btn{white-space:nowrap;flex:0 0 auto}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.product-card{padding:0;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.product-card-image{height:150px;background:#E8EDF5;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.85rem}
.product-card-image img{width:100%;height:100%;object-fit:cover}
.product-card-body{padding:12px;display:flex;flex-direction:column;gap:6px}
.product-card-body>strong{font-size:1.05rem}
.product-category{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.product-price{font-weight:800;font-size:1.12rem}
.product-card-body small{color:var(--mute)}
.product-photo-preview{height:150px;border-radius:10px;background:#E8EDF5;display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden}
.product-photo-preview img{width:100%;height:100%;object-fit:contain}
.order-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.order-head{display:flex;justify-content:space-between;gap:12px}
.order-head small{display:block;color:var(--mute);margin-top:3px}
.order-items{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.order-items span{background:#E8EDF5;border-radius:20px;padding:4px 9px;font-size:.85rem}
.order-card label{margin-top:8px}
\n .notif-bell{position:relative;font-size:1.35rem;padding:4px 8px}.notif-badge{position:absolute;top:-3px;right:-2px;background:#C0272D;color:#fff;border-radius:99px;font-size:.68rem;min-width:17px;height:17px;line-height:17px;text-align:center}.notif-panel{position:fixed;z-index:30;right:12px;top:68px;width:min(370px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:0 12px 35px #10223f30;border-radius:12px;padding:12px}.notif-panel[hidden]{display:none}.notif-panel-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px}.notif-item{border-top:1px solid var(--line);padding:10px 4px}.notif-item p{margin:4px 0;color:var(--mute)}.notif-item small{color:var(--mute)}.notif-item.warning{border-left:4px solid #D89B28;padding-left:9px}.notif-item.danger{border-left:4px solid var(--red);padding-left:9px}

/* Agenda: experiencia responsive y visual */
.agenda-shell{display:grid;gap:18px;min-width:0}.agenda-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 2px}.agenda-header h2{font-size:clamp(1.65rem,3vw,2rem);letter-spacing:-.04em}.agenda-header p{margin:5px 0 0;color:var(--mute);font-size:.94rem}.agenda-eyebrow{display:block;color:var(--blue);font-size:.7rem;font-weight:800;letter-spacing:.13em;margin-bottom:5px}.agenda-nueva{white-space:nowrap;min-height:46px;box-shadow:0 5px 14px #10223f18}.agenda-nueva span{font-size:1.15rem;margin-right:5px}.agenda-resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.agenda-metrica{display:flex;align-items:center;gap:11px;min-width:0;padding:14px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #10223f08}.agenda-metrica-icon{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:11px;font-size:1.05rem;font-weight:800}.agenda-metrica-icon.total{background:#edf1f7;color:#344b6b}.agenda-metrica-icon.pendiente{background:#fff3df;color:#98610b}.agenda-metrica-icon.confirmada{background:#e8f0ff;color:#2f63ad}.agenda-metrica-icon.atendida{background:#e5f4eb;color:#247348}.agenda-metrica small{display:block;color:var(--mute);font-size:.76rem;line-height:1.25}.agenda-metrica strong{display:block;font-size:1.35rem;line-height:1.2;margin-top:3px;font-variant-numeric:tabular-nums}.agenda-toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;padding:14px;background:#fff;border:1px solid var(--line);border-radius:13px}.agenda-navegacion{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}.agenda-flecha{width:42px;height:42px;padding:0;font-size:1.5rem;line-height:1}.agenda-navegacion input{width:auto;min-width:145px;min-height:42px;padding:8px 10px}.agenda-rango{font-weight:700;text-transform:capitalize;margin-left:5px}.agenda-filtros{display:flex;align-items:end;gap:10px}.agenda-filtros label{display:grid;gap:5px;margin:0;font-size:.78rem;color:var(--mute)}.agenda-filtros select{min-width:135px;min-height:42px;padding:8px 30px 8px 10px;border-radius:9px;font-size:.9rem}.agenda-contenido{min-width:0}.agenda-dia-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.agenda-dia-titulo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}.agenda-dia-titulo h3{margin:2px 0 0;font-size:1.12rem;text-transform:capitalize}.agenda-total-dia{background:#edf1f7;color:#344b6b;padding:6px 11px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}.agenda-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px;padding-top:14px}.agenda-cita{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;min-width:0;padding:13px 14px;background:#fff;border:1px solid var(--line);border-left:4px solid #9aa8ba;border-radius:11px;text-align:left;color:var(--ink);transition:box-shadow .15s,border-color .15s}.agenda-cita:hover{box-shadow:0 5px 16px #10223f12;border-color:#b7c4d5}.agenda-cita-hora{font-size:.76rem;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}.agenda-cita>strong{font-size:.98rem;overflow-wrap:anywhere}.agenda-cita-detalle{font-size:.82rem;color:var(--mute);overflow-wrap:anywhere}.agenda-cita .chip{margin-top:3px}.agenda-cita:has(.chip.PENDIENTE){border-left-color:#d69a31}.agenda-cita:has(.chip.CONFIRMADA){border-left-color:#4779d1}.agenda-cita:has(.chip.ATENDIDA){border-left-color:#299653}.agenda-cita:has(.chip.CANCELADA),.agenda-cita:has(.chip.NO_ASISTIO){border-left-color:#c65b60}.agenda-vacio{display:flex;align-items:center;flex-direction:column;gap:8px;text-align:center;padding:34px 16px;color:var(--mute)}.agenda-vacio-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:#edf1f7;color:#526985;font-size:1.5rem}.agenda-vacio strong{color:var(--ink);font-size:1rem}.agenda-vacio .btn{margin-top:7px}.agenda-semana-scroll,.agenda-mes-scroll{overflow-x:auto;overscroll-behavior-x:contain;padding-bottom:5px}.agenda-semana{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:9px;min-width:1050px}.agenda-columna{min-width:0;min-height:230px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px}.agenda-columna.es-hoy{border-color:#7c9cc8;box-shadow:inset 0 3px 0 var(--blue)}.agenda-columna-head{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 10px;border-bottom:1px solid var(--line);text-transform:capitalize}.agenda-columna-head span{font-size:.78rem;color:var(--mute);font-weight:700}.agenda-columna-head strong{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#edf1f7;font-size:.9rem}.agenda-columna.es-hoy .agenda-columna-head strong{background:var(--ink);color:#fff}.agenda-columna-citas{display:grid;gap:7px;padding-top:9px}.agenda-columna .agenda-cita{padding:9px;gap:4px}.agenda-columna .agenda-cita>strong{font-size:.83rem}.agenda-columna .agenda-cita-detalle{font-size:.72rem}.agenda-columna .chip{font-size:.68rem;padding:2px 7px}.agenda-sin-citas{padding:10px 2px;color:#929baa;font-size:.76rem;text-align:center}.agenda-mes{min-width:680px;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.agenda-mes-dias,.agenda-mes-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.agenda-mes-dias{background:#f0f3f8;border-bottom:1px solid var(--line)}.agenda-mes-dias span{text-align:center;padding:10px 4px;color:var(--mute);font-size:.76rem;font-weight:800}.agenda-mes-celda{min-width:0;min-height:100px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.agenda-mes-celda:nth-child(7n){border-right:0}.agenda-mes-celda.fuera-mes{background:#f8f9fb}.agenda-mes-celda.fuera-mes .agenda-dia-numero{color:#a3aab5}.agenda-mes-celda.es-seleccionado{background:#f2f6fc;box-shadow:inset 0 0 0 2px #7c9cc8}.agenda-dia-numero{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.82rem;font-weight:800;padding:3px 6px;border-radius:6px}.agenda-dia-numero:hover{background:#e5ebf4}.agenda-mes-citas{display:grid;gap:3px;margin-top:4px}.agenda-mes-cita{display:flex;gap:4px;align-items:center;min-width:0;width:100%;padding:4px 5px;border:0;border-radius:5px;background:#eaf1ff;color:#244f88;text-align:left;font-size:.68rem}.agenda-mes-cita time{font-weight:800;white-space:nowrap}.agenda-mes-cita span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agenda-mes-citas>small{font-size:.66rem;color:var(--mute);padding-left:4px}.agenda-leyenda{display:flex;flex-wrap:wrap;gap:12px 18px;color:var(--mute);font-size:.75rem;padding:0 3px}.agenda-leyenda span{display:flex;align-items:center;gap:6px}.agenda-leyenda i{width:8px;height:8px;border-radius:50%;background:#d69a31}.agenda-leyenda i.confirmada{background:#4779d1}.agenda-leyenda i.atendida{background:#299653}.agenda-leyenda i.cancelada{background:#c65b60}
@media(max-width:700px){main{padding:12px 12px calc(94px + env(safe-area-inset-bottom))}.agenda-shell{gap:13px}.agenda-header{align-items:flex-start}.agenda-header p{font-size:.83rem;max-width:34ch}.agenda-nueva{padding:11px 12px;font-size:.86rem;min-height:42px}.agenda-resumen{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.agenda-metrica{padding:10px;gap:8px}.agenda-metrica-icon{flex-basis:33px;height:33px}.agenda-metrica small{font-size:.7rem}.agenda-metrica strong{font-size:1.2rem}.agenda-toolbar{padding:11px;gap:12px}.agenda-navegacion{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:7px}.agenda-navegacion input{width:100%;min-width:0}.agenda-flecha{width:40px;height:42px}.agenda-rango{grid-column:1/-1;margin:0;font-size:.9rem;text-align:center}.agenda-filtros{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.agenda-filtros select{width:100%;min-width:0}.agenda-dia-panel{padding:13px}.agenda-lista{grid-template-columns:1fr}.agenda-semana{min-width:1050px}.agenda-mes{min-width:640px}.agenda-mes-celda{min-height:76px;padding:4px}.agenda-mes-dias span{padding:8px 2px;font-size:.68rem}.agenda-mes-cita{font-size:.62rem;padding:3px}.agenda-leyenda{gap:9px 13px;font-size:.69rem}}

/* Servicios: catálogo profesional y adaptable */
.services-shell{display:grid;gap:18px;min-width:0}
.services-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 2px}
.services-header h2{font-size:clamp(1.7rem,3vw,2.1rem);letter-spacing:-.045em}
.services-header p{margin:6px 0 0;color:var(--mute);font-size:.94rem}
.services-eyebrow{display:block;margin-bottom:6px;color:var(--blue);font-size:.69rem;font-weight:800;letter-spacing:.14em}
.services-new{min-height:46px;white-space:nowrap;box-shadow:0 5px 14px #10223f18}
.services-new span{font-size:1.15rem;margin-right:5px}
.services-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.services-stat{display:flex;align-items:center;gap:12px;min-width:0;padding:15px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #10223f08}
.services-stat-icon{display:grid;place-items:center;flex:0 0 40px;height:40px;border-radius:12px;background:#edf1f7;color:#344b6b;font-size:1.2rem;font-weight:800}
.services-stat-icon.active{background:#e5f4eb;color:#247348}
.services-stat-icon.category{background:#eaf1ff;color:#2f63ad}
.services-stat small{display:block;color:var(--mute);font-size:.76rem;line-height:1.25}
.services-stat strong{display:block;margin-top:3px;font-size:1.4rem;line-height:1.15;font-variant-numeric:tabular-nums}
.services-tools{display:grid;grid-template-columns:minmax(220px,1fr) minmax(170px,.45fr) auto;align-items:end;gap:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:13px}
.services-search{display:flex;align-items:center;gap:9px;min-width:0;margin:0;color:var(--mute)}
.services-search>span{font-size:1.45rem;line-height:1}
.services-search input{min-width:0;min-height:43px;padding:9px 11px;border-radius:9px}
.services-category{display:grid;gap:5px;margin:0;color:var(--mute);font-size:.78rem}
.services-category select{min-width:0;min-height:43px;padding:8px 10px;border-radius:9px;font-size:.9rem}
.services-inactive{margin:0 0 9px;white-space:nowrap;font-size:.82rem}
.services-results-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.services-results-head strong{font-size:.96rem}
.services-results-head span{color:var(--mute);font-size:.78rem}
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:13px;min-width:0}
.service-card{display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:205px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-align:left;box-shadow:0 2px 8px #10223f07;transition:border-color .15s,box-shadow .15s,transform .15s}
.service-card:hover{border-color:#aabbd1;box-shadow:0 8px 22px #10223f12;transform:translateY(-2px)}
.service-card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.service-card.is-inactive{background:#fafbfc;opacity:.78}
.service-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.service-category{max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 9px;border-radius:99px;background:#edf2f8;color:#425a79;font-size:.69rem;font-weight:800;letter-spacing:.025em}
.service-status{display:inline-flex;align-items:center;gap:5px;color:#247348;font-size:.72rem;font-weight:700;white-space:nowrap}
.service-status i{width:7px;height:7px;border-radius:50%;background:#299653}
.service-status.inactive{color:var(--mute)}
.service-status.inactive i{background:#9aa4b2}
.service-card-name{display:block;margin-top:17px;font-size:1.12rem;line-height:1.25;letter-spacing:-.02em;overflow-wrap:anywhere}

<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module">
import { sb } from "./src/lib/supabase.js";
import { esc, fecha, hora, bonito, traducir, waNum } from "./src/shared/utils.js";
import { crearConfigCatalogos } from "./src/config/catalogos.js";
import { crearModuloCatalogos } from "./src/modules/catalogos.js";
import { crearModuloProductos } from "./src/modules/productos.js";
import { crearModuloAgenda } from "./src/modules/agenda.js";
import { crearModuloEquipo } from "./src/modules/equipo.js";
import { crearModuloVentas } from "./src/modules/ventas.js";
import { crearModuloFinanzas } from "./src/modules/finanzas.js";
import { crearModuloInicio } from "./src/modules/inicio.js";
import { crearModuloAjustes } from "./src/modules/ajustes.js";
import { crearModuloNotificaciones } from "./src/modules/notificaciones.js";
import { crearModuloAcceso } from "./src/modules/acceso.js";
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const S={perfil:null,negocio:null,vista:'inicio',dia:fecha(new Date())};
const dinero=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:S.negocio?.moneda||'COP',maximumFractionDigits:0}).format(n||0);
const METODOS=['EFECTIVO','TRANSFERENCIA','TARJETA','NEQUI','DAVIPLATA'].map(m=>`<option value="${m}">${bonito(m)}</option>`).join('');
const fm=d=>new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const fila2=(a,b,c='')=>`<div class="ln2 ${c}"><span>${a}</span><span>${b}</span></div>`;
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',4000)}

const NOTIF=crearModuloNotificaciones({ $, sb, S, esc, toast });

/* ---------- Acceso ---------- */
/* ---------- Estructura ---------- */
const MENU=[['inicio','Inicio'],['agenda','Agenda'],['ventas','Ventas'],['pedidos','Pedidos'],['clientes','Clientes'],['barberos','Barberos'],['servicios','Servicios'],['productos','Productos'],['caja','Caja',1],['comisiones','Comisiones',1],['ajustes','Ajustes',2],['miscom','Mis comisiones',3],['miperfil','Mi perfil',3]];
const { pantallaAuth, cargar, aviso } = crearModuloAcceso({ $, app, sb, S, esc, traducir, toast, waNum, shell });
function shell(){
 app.innerHTML=`<div class="pole"></div><div class="bar">${S.negocio.logo_url?`<img src="${esc(S.negocio.logo_url)}" alt="${esc(S.negocio.nombre)}" style="height:44px;display:block">`:`<strong>${esc(S.negocio.nombre)}</strong>`}<span><small>${esc(S.perfil.nombre)}, ${S.perfil.rol.toLowerCase()}</small> <button type="button" class="link light notif-bell" id="campana-notificaciones" aria-label="Notificaciones">♢</button> <button class="link light" id="out">Salir</button></span></div>
 <nav class="nav">${MENU.filter(m=>!m[2]||(m[2]===3?S.perfil.rol==='BARBERO':m[2]===2?ADM.includes(S.perfil.rol):ADM.includes(S.perfil.rol))).map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</nav><div class="wrap">${aviso()}<main id="main"></main></div>`;
 $('#out').onclick=()=>{NOTIF.detener();sb.auth.signOut()};
 NOTIF.iniciar();
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.vista=b.dataset.v;ir()});
 ir();
}
function ir(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));({inicio,agenda,ventas,productos,pedidos:pedidosProductos,caja,comisiones,ajustes,miscom:misComisiones,miperfil:miPerfil}[S.vista]||(()=>crud(S.vista)))()}

/* ---------- Clientes, barberos y servicios ---------- */
const ADM=['ADMINISTRADOR','SUPERVISOR'];
const soloMio=()=>S.perfil.rol==='BARBERO'&&!!S.perfil.barbero_id,mio=q=>soloMio()?q.eq('barbero_id',S.perfil.barbero_id):q;
const { horarios, equipo, miPerfil } = crearModuloEquipo({ $, dlg, sb, S, esc, bonito, toast });
const { ajustes } = crearModuloAjustes({ $, sb, S, esc, toast, equipo, ir, notificaciones: NOTIF });
const CFG=crearConfigCatalogos(ADM,dinero);
const { crud } = crearModuloCatalogos({ $, app, dlg, sb, S, CFG, esc, bonito, traducir, toast, horarios });
const { productos, pedidos:pedidosProductos } = crearModuloProductos({ $, dlg, sb, S, esc, dinero, traducir, toast });
const { ventas, nuevaVenta } = crearModuloVentas({ $, dlg, sb, S, esc, dinero, hora, bonito, traducir, toast, ADM, METODOS, mio });
