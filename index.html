<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10223F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Barbería</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10223F;--paper:#F6F7F9;--line:#DDE2EA;--red:#C0272D;--blue:#2F6DB5;--mute:#5B6778;--ok:#1F7A4D}
*{box-sizing:border-box}
body{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4}
.pole{height:8px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin:.6em 0 .2em;line-height:1.1}
h2{margin:0;font-size:1.6rem;letter-spacing:-.01em}
.auth{max-width:420px;margin:0 auto;padding:24px 20px 40px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:600}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%;margin-top:20px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;padding:8px}
.link.light{color:#fff}
.mute{color:var(--mute)}
.info{background:#DCE8F7;padding:12px;border-radius:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff;position:relative;z-index:6}
nav.nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.nav button{flex:1 0 auto;padding:16px 14px;background:none;border:0;font-weight:600;color:var(--mute);position:relative}
nav.nav button.on{color:var(--ink)}
nav.nav button.on::after{content:"";position:absolute;top:0;left:20%;right:20%;height:4px;background:var(--red)}
main{padding:16px 16px 100px;max-width:900px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;width:100%;text-align:left;color:inherit}
.row small{color:var(--mute)}
.row.off{opacity:.55}
.chip{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:#E8EDF5;white-space:nowrap}
.chip.ATENDIDA{background:#DDF2E6;color:var(--ok)}
.chip.CONFIRMADA{background:#DCE8F7;color:var(--blue)}
.chip.CANCELADA,.chip.NO_ASISTIO{background:#F9DEDF;color:var(--red)}
.empty{color:var(--mute);padding:24px 0}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 14px}
.chk input{width:auto}
.dia{display:flex;gap:8px}
.dia .btn{width:52px;padding:0}
.cap{margin:10px 0 14px}
.cap::first-letter{text-transform:uppercase}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
dialog{border:0;border-radius:14px;padding:20px;width:min(520px,calc(100vw - 24px));max-height:92dvh;color:var(--ink)}
dialog::backdrop{background:rgba(16,34,63,.55)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media(min-width:900px){
 nav.nav{top:0;bottom:auto;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:84px}
 nav.nav button{text-align:left;padding:14px 24px;flex:none}
 nav.nav button.on::after{top:20%;bottom:20%;left:0;right:auto;width:4px;height:auto}
 .wrap{padding-left:220px}
 main{padding-bottom:40px}
}
.chip.PAGADA{background:#DDF2E6;color:var(--ok)}
.chip.ANULADA{background:#F9DEDF;color:var(--red)}
.ln{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-bottom:8px}
.ln2{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.tot{font-weight:800}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kp small{display:block;color:var(--mute)}.kp strong{font-size:1.15rem}
.hr{display:grid;grid-template-columns:1fr 100px 100px;gap:6px;align-items:center;margin-top:8px}
.hr .chk{margin:0}.hr input[type=time]{padding:8px 6px}
.hd{margin-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.hr2{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center}
.hr2 input{padding:8px 6px}.hr2 small{color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module">
import { sb } from "./src/lib/supabase.js";
import { esc, fecha, hora, bonito, slug, traducir, waNum } from "./src/shared/utils.js";
import { crearConfigCatalogos } from "./src/config/catalogos.js";
import { crearModuloCatalogos } from "./src/modules/catalogos.js";
import { crearModuloAgenda } from "./src/modules/agenda.js";
import { crearModuloEquipo } from "./src/modules/equipo.js";
import { crearModuloVentas } from "./src/modules/ventas.js";
import { crearModuloFinanzas } from "./src/modules/finanzas.js";
const $=s=>document.querySelector(s),app=$('#app'),dlg=$('#dlg');
const S={perfil:null,negocio:null,vista:'inicio',dia:fecha(new Date())};
const dinero=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:S.negocio?.moneda||'COP',maximumFractionDigits:0}).format(n||0);
const METODOS=['EFECTIVO','TRANSFERENCIA','TARJETA','NEQUI','DAVIPLATA'].map(m=>`<option value="${m}">${bonito(m)}</option>`).join('');
const fm=d=>new Date(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const fila2=(a,b,c='')=>`<div class="ln2 ${c}"><span>${a}</span><span>${b}</span></div>`;
let tt;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',4000)}

/* ---------- Acceso ---------- */
function pantallaAuth(modo='login',msg=''){
 const reg=modo==='registro';
 app.innerHTML=`<div class="pole"></div><div class="auth"><h1>${reg?'Crea tu cuenta':'Entra a tu barbería'}</h1>
 <p class="mute">${reg?'Registra tu correo para empezar. Después escribes el código de invitación que te enviaron.':'Agenda, clientes y equipo en un solo lugar.'}</p>
 ${msg?`<p class="info">${esc(msg)}</p>`:''}
 <form id="f"><label for="em">Correo</label><input id="em" type="email" autocomplete="email" required>
 <label for="pw">Contraseña</label><input id="pw" type="password" minlength="6" autocomplete="${reg?'new-password':'current-password'}" required>
 <button class="btn block">${reg?'Crear cuenta':'Entrar'}</button></form>
 <p style="text-align:center;margin-top:20px"><button class="link" id="sw">${reg?'Ya tengo cuenta':'Soy nuevo, crear cuenta'}</button></p></div>`;
 $('#sw').onclick=()=>pantallaAuth(reg?'login':'registro');
 $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
  const c={email:$('#em').value.trim(),password:$('#pw').value};
  const{data,error}=reg?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  b.disabled=false;
  if(error)return toast(traducir(error.message),true);
  if(data.session)cargar();else pantallaAuth('login','Te enviamos un correo para confirmar tu cuenta. Confírmalo y luego entra.')};
}
function onboarding(){
 app.innerHTML=`<div class="pole"></div><div class="auth"><h1>Entra con tu código</h1><p class="mute">Escribe el código de invitación que te envió quien te presta el servicio.</p>
 <form id="jf"><label for="jc">Código de invitación</label><input id="jc" autocomplete="off" required><label for="jn">Tu nombre</label><input id="jn" required><button class="btn block">Unirme con el código</button></form>
 <p style="text-align:center;margin-top:20px"><button class="link" id="out">Salir</button></p></div>`;
 $('#out').onclick=()=>sb.auth.signOut();
 $('#jf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('.btn');b.disabled=true;
  const{error}=await sb.rpc('unirse_con_codigo',{p_codigo:$('#jc').value.trim(),p_nombre:$('#jn').value.trim()});
  b.disabled=false;if(error)return toast(traducir(error.message),true);cargar()};
}
async function cargar(){
 const{data:{user}}=await sb.auth.getUser();
 const{data:p,error}=await sb.from('perfiles').select('*,negocios(*)').eq('id',user.id).maybeSingle();
 if(error)return toast(error.message,true);
 if(!p)return onboarding();
 const{data:su}=await sb.rpc('mi_suscripcion');S.sus=su;
 if(!su||su.dias<0||su.estado!=='ACTIVA'||!p.negocios)return bloqueada(su);
 S.perfil=p;S.negocio=p.negocios;shell();
}

/* ---------- Plan y suscripción ---------- */
function bloqueada(su){
 const venc=su&&su.dias<0,wa=waNum(su?.contacto);
 app.innerHTML=`<div class="pole"></div><div class="auth"><h1>${venc?'Tu plan venció':'Acceso no disponible'}</h1>
 <p class="mute">${venc?`El plan de ${esc(su.negocio)} venció el ${esc(su.vence_en)}. Renuévalo para volver a entrar. Tus datos están guardados.`:'Tu acceso no está activo. Habla con el administrador de tu barbería o con soporte.'}</p>
 ${wa?`<a class="btn block" style="display:block;text-align:center;text-decoration:none;background:#1F7A4D" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent('Hola, quiero renovar mi plan'+(su?' de '+su.negocio:''))}">Escribir por WhatsApp</a>`:''}
 <p style="text-align:center;margin-top:20px"><button class="link" id="out">Salir</button></p></div>`;
 $('#out').onclick=()=>sb.auth.signOut();
}
function aviso(){const s=S.sus;if(!s||s.dias>5)return '';const wa=waNum(s.contacto);
 return `<p class="info" style="margin:0;text-align:center">Tu plan vence ${s.dias===0?'hoy':'en '+s.dias+' día'+(s.dias>1?'s':'')}. ${wa?`<a href="https://wa.me/${wa}?text=${encodeURIComponent('Hola, quiero renovar mi plan de '+s.negocio)}" target="_blank" rel="noopener">Renovar</a>`:''}</p>`}

/* ---------- Estructura ---------- */
const MENU=[['inicio','Inicio'],['agenda','Agenda'],['ventas','Ventas'],['clientes','Clientes'],['barberos','Barberos'],['servicios','Servicios'],['productos','Productos'],['caja','Caja',1],['comisiones','Comisiones',1],['ajustes','Ajustes',2],['miscom','Mis comisiones',3]];
function shell(){
 app.innerHTML=`<div class="pole"></div><div class="bar">${S.negocio.logo_url?`<img src="${esc(S.negocio.logo_url)}" alt="${esc(S.negocio.nombre)}" style="height:44px;display:block">`:`<strong>${esc(S.negocio.nombre)}</strong>`}<span><small>${esc(S.perfil.nombre)}, ${S.perfil.rol.toLowerCase()}</small> <button class="link light" id="out">Salir</button></span></div>
 <nav class="nav">${MENU.filter(m=>!m[2]||(m[2]===3?S.perfil.rol==='BARBERO':m[2]===2?S.perfil.rol==='ADMINISTRADOR':ADM.includes(S.perfil.rol))).map(([k,l])=>`<button data-v="${k}">${l}</button>`).join('')}</nav><div class="wrap">${aviso()}<main id="main"></main></div>`;
 $('#out').onclick=()=>sb.auth.signOut();
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.vista=b.dataset.v;ir()});
 ir();
}
function ir(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));({inicio,agenda,ventas,caja,comisiones,ajustes,miscom:misComisiones}[S.vista]||(()=>crud(S.vista)))()}

/* ---------- Clientes, barberos y servicios ---------- */
const ADM=['ADMINISTRADOR','SUPERVISOR'];
const soloMio=()=>S.perfil.rol==='BARBERO'&&!!S.perfil.barbero_id,mio=q=>soloMio()?q.eq('barbero_id',S.perfil.barbero_id):q;
const { horarios, equipo, invitar } = crearModuloEquipo({ $, dlg, sb, S, esc, bonito, toast });
const CFG=crearConfigCatalogos(ADM,dinero);
const { crud, formulario } = crearModuloCatalogos({ $, app, dlg, sb, S, CFG, esc, bonito, traducir, toast, horarios });
const { ventas, nuevaVenta, detalleVenta } = crearModuloVentas({ $, dlg, sb, S, esc, dinero, hora, bonito, traducir, toast, ADM, METODOS });
const { caja, gasto, comisiones } = crearModuloFinanzas({ $, dlg, sb, S, esc, dinero, hora, bonito, toast, METODOS, fila2, fm, detallePagos });
const { agenda, nuevaCita, editarCita, cobrarCita, porConfirmar } = crearModuloAgenda({ $, app, dlg, sb, S, esc, hora, bonito, fecha, traducir, toast, wa, nuevaVenta, mio, ir });
/* ---------- Agenda ---------- */

async function misComisiones(){
 const b=S.perfil.barbero_id,main=$('#main');
 if(!b)return main.innerHTML='<div class="head"><h2>Mis comisiones</h2></div><p class="empty">Tu usuario no está ligado a un barbero. Pide a la administración que lo configure.</p>';
 const[{data:d},{data:l}]=await Promise.all([sb.from('detalle_ventas').select('id,descripcion,cantidad,subtotal,comision_generada,ventas!inner(fecha_hora,barbero_id,estado_venta)').eq('ventas.barbero_id',b).eq('ventas.estado_venta','PAGADA').gt('comision_generada',0).limit(500),sb.from('comisiones').select('detalle_id').eq('barbero_id',b).limit(2000)]);
 const pagado=new Set((l||[]).map(x=>x.detalle_id)),L=(d||[]).sort((p,q)=>new Date(q.ventas.fecha_hora)-new Date(p.ventas.fecha_hora)),pend=L.filter(x=>!pagado.has(x.id)),hist=L.filter(x=>pagado.has(x.id)),sum=a=>a.reduce((t,x)=>t+Number(x.comision_generada),0);
 const fl=x=>fila2(esc(x.descripcion)+'<br><small>'+new Date(x.ventas.fecha_hora).toLocaleDateString('es-CO',{day:'numeric',month:'short'})+'</small>',dinero(x.comision_generada));
 main.innerHTML=`<div class="head"><h2>Mis comisiones</h2></div><div class="kp"><div><small>Por cobrar</small><strong>${dinero(sum(pend))}</strong></div><div><small>Ya liquidado</small><strong>${dinero(sum(hist))}</strong></div></div>
 ${pend.length?'<label>Pendientes</label>'+pend.slice(0,30).map(fl).join(''):'<p class="empty">No tienes comisiones pendientes.</p>'}${hist.length?'<label>Últimas liquidadas</label>'+hist.slice(0,15).map(fl).join(''):''}`;
}

/* ---------- Horarios ---------- */
/* ---------- Ventas y pagos ---------- */
/* ---------- Caja, gastos y comisiones ---------- */
/* ---------- Recordatorio por WhatsApp ---------- */
function wa(c,conf){
 const tel=String(c.clientes?.telefono||'').replace(/\D/g,'');
 if(tel.length<7)return '<p class="mute">Este cliente no tiene teléfono guardado, no se puede enviar el recordatorio.</p>';
 const num=tel.length===10?'57'+tel:tel,url=location.origin+location.pathname.replace(/[^/]*$/,'')+'cita.html?t='+c.token;
 const cuando=new Date(c.inicio).toLocaleString('es-CO',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
 const msg=conf?`Hola ${c.clientes.nombre}, tu cita en ${S.negocio.nombre} quedó confirmada: ${cuando}, ${c.servicios?.nombre} con ${c.barberos?.nombre}.\nSi necesitas cambiar la hora o cancelarla, hazlo aquí: ${url}`:`Hola ${c.clientes.nombre}, te recordamos tu cita en ${S.negocio.nombre}: ${cuando}, ${c.servicios?.nombre} con ${c.barberos?.nombre}.\nConfirma, cancela o cambia la hora aquí: ${url}`;
 return `<a class="btn block" style="display:block;text-align:center;text-decoration:none;background:#1F7A4D" target="_blank" rel="noopener" id="${conf?'cf':'rw'}" href="https://wa.me/${num}?text=${encodeURIComponent(msg)}">${conf?'Confirmar y avisar por WhatsApp':'Recordar por WhatsApp'}</a>`;
}

/* ---------- Detalle de cobros y panel gerencial ---------- */
function detallePagos(m,L){
 const por={};L.forEach(p=>{const n=p.cuentas?p.cuentas.nombre+(p.cuentas.detalle?' ('+p.cuentas.detalle+')':''):'Sin cuenta registrada';por[n]=(por[n]||0)+Number(p.valor_pago)});
 dlg.innerHTML=`<h2>Cobrado en ${bonito(m).toLowerCase()}</h2><p class="tot">${dinero(L.reduce((t,p)=>t+Number(p.valor_pago),0))}</p>
 ${m==='EFECTIVO'?'':'<label>Por cuenta</label>'+Object.entries(por).map(([n,v])=>fila2(esc(n),dinero(v))).join('')}
 <label>Movimientos</label>${L.map(p=>fila2(hora(p.fecha_hora)+', '+esc(p.ventas?.clientes?.nombre||'Cliente de paso')+(p.cuentas&&m!=='EFECTIVO'?'<br><small>'+esc(p.cuentas.nombre)+'</small>':''),dinero(p.valor_pago))).join('')}
 <div class="acts"><button type="button" class="btn sec" id="cx">Cerrar</button></div>`;
 dlg.showModal();$('#cx').onclick=()=>dlg.close();
}
const RG=[['hoy','Hoy'],['ayer','Ayer'],['semana','Esta semana'],['mes','Este mes'],['30','Últimos 30 días'],['custom','Personalizado']];
function rango(v,a,b){const d=new Date();d.setHours(0,0,0,0);const s=new Date(d);let e=new Date(d);e.setDate(e.getDate()+1);
 if(v==='ayer'){s.setDate(s.getDate()-1);e=new Date(d)}
 else if(v==='semana')s.setDate(s.getDate()-((s.getDay()+6)%7));
 else if(v==='mes')s.setDate(1);
 else if(v==='30')s.setDate(s.getDate()-29);
 else if(v==='custom'){const x=new Date((a||fecha(d))+'T00:00:00');e=new Date((b||fecha(d))+'T00:00:00');e.setDate(e.getDate()+1);return[x,e]}
 return[s,e]}
function inicio(){return ADM.includes(S.perfil.rol)?informe():inicioSimple()}
async function informe(){
 const[s,e]=rango(S.rg||'hoy',S.ra,S.rb),A=s.toISOString(),B=e.toISOString(),rg=S.rg||'hoy';
 $('#main').innerHTML=`<div class="head"><h2>Panel gerencial</h2></div><div id="pc"></div><select id="rg" aria-label="Periodo">${RG.map(([k,l])=>`<option value="${k}"${k===rg?' selected':''}>${l}</option>`).join('')}</select>
 ${rg==='custom'?`<div class="dia" style="margin-top:8px"><input type="date" id="ra" value="${S.ra||fecha(new Date())}" aria-label="Desde"><input type="date" id="rb" value="${S.rb||fecha(new Date())}" aria-label="Hasta"></div>`:''}<div id="inf"><p class="empty">Calculando…</p></div>`;
 $('#rg').onchange=x=>{S.rg=x.target.value;informe()};
 porConfirmar();
 if(rg==='custom')['ra','rb'].forEach(i=>$('#'+i).onchange=x=>{S[i]=x.target.value;informe()});
 const[V,D,P,G,C]=(await Promise.all([
  sb.from('ventas').select('descuento').neq('estado_venta','ANULADA').gte('fecha_hora',A).lt('fecha_hora',B).limit(5000),
  sb.from('detalle_ventas').select('tipo_item,descripcion,cantidad,subtotal,costo_unitario,comision_generada,ventas!inner(estado_venta,fecha_hora,barberos(nombre))').neq('ventas.estado_venta','ANULADA').gte('ventas.fecha_hora',A).lt('ventas.fecha_hora',B).limit(5000),
  sb.from('pagos').select('valor_pago,metodo_pago,cuentas(nombre),ventas!inner(estado_venta)').eq('estado_pago','REGISTRADO').neq('ventas.estado_venta','ANULADA').gte('fecha_hora',A).lt('fecha_hora',B).limit(5000),
  sb.from('gastos').select('categoria_gasto,valor').eq('estado_gasto','REGISTRADO').gte('fecha_hora',A).lt('fecha_hora',B).limit(5000),
  sb.from('citas').select('estado').gte('inicio',A).lt('inicio',B).limit(5000)])).map(r=>r.data||[]);
 const sum=(a,f)=>a.reduce((t,x)=>t+Number(f(x)||0),0),cl=x=>Number(x.costo_unitario)*Number(x.cantidad)+Number(x.comision_generada);
 const bruto=sum(D,x=>x.subtotal),desc=sum(V,x=>x.descuento),neto=bruto-desc,costo=sum(D,x=>Number(x.costo_unitario)*Number(x.cantidad)),com=sum(D,x=>x.comision_generada);
 const gast=sum(G.filter(x=>!['COMISIONES','PRODUCTOS'].includes(x.categoria_gasto)),x=>x.valor),util=neto-costo-com-gast;
 const grp=(a,k,f)=>{const m={};a.forEach(x=>{const n=k(x);m[n]=m[n]||{n,c:0,i:0,k:0};f(m[n],x)});return Object.values(m)};
 const lin=(g,e)=>fila2(esc(g.n)+'<br><small>'+g.c+' '+e+', ingresos '+dinero(g.i)+', costo '+dinero(g.k)+'</small>',dinero(g.i-g.k));
 const mg=(a,k,e,flt)=>grp(a.filter(flt||(()=>true)),k,(g,x)=>{g.c+=Number(x.cantidad);g.i+=Number(x.subtotal);g.k+=cl(x)}).sort((p,q)=>(q.i-q.k)-(p.i-p.k)).map(g=>lin(g,e));
 const sec=(t,r)=>r.length?`<label>${t}</label>`+r.join(''):'';
 const pm=grp(P,x=>bonito(x.metodo_pago),(g,x)=>{g.i+=Number(x.valor_pago)}).map(g=>fila2(esc(g.n),dinero(g.i))),pc=grp(P.filter(x=>x.cuentas),x=>x.cuentas.nombre,(g,x)=>{g.i+=Number(x.valor_pago)}).map(g=>fila2(esc(g.n),dinero(g.i)));
 $('#inf').innerHTML=`<div class="kp"><div><small>Ventas netas</small><strong>${dinero(neto)}</strong></div><div><small>Utilidad estimada</small><strong>${dinero(util)}</strong></div><div><small>Ventas</small><strong>${V.length}</strong></div><div><small>Citas atendidas</small><strong>${C.filter(x=>x.estado==='ATENDIDA').length}</strong></div></div>
 ${fila2('Ventas brutas',dinero(bruto))}${fila2('Descuentos','-'+dinero(desc))}${fila2('Costo de productos vendidos','-'+dinero(costo))}${fila2('Comisiones de barberos','-'+dinero(com))}${fila2('Gastos operativos','-'+dinero(gast))}${fila2('Utilidad estimada',dinero(util),'tot')}
 <p class="mute">No se restan aparte las compras de mercancía ni las liquidaciones de comisión: su costo ya está en las líneas de arriba.</p>
 ${sec('Margen por barbero',mg(D,x=>x.ventas.barberos?.nombre||'Sin barbero','servicios y productos'))}
 ${sec('Margen por producto',mg(D,x=>x.descripcion,'vendidos',x=>x.tipo_item==='PRODUCTO'))}
 ${sec('Margen por servicio',mg(D,x=>x.descripcion,'servicios',x=>x.tipo_item==='SERVICIO'))}
 ${sec('Cobrado por método de pago',pm)}${sec('Cobrado por cuenta',pc)}`;
}

/* ---------- Resumen y ajustes ---------- */
async function inicioSimple(){
 const h0=new Date();h0.setHours(0,0,0,0);const h1=new Date(h0);h1.setDate(h1.getDate()+1);
 const[{data:v},{data:c},{data:s}]=await Promise.all([
  mio(sb.from('ventas').select('total_venta').neq('estado_venta','ANULADA').gte('fecha_hora',h0.toISOString()).lt('fecha_hora',h1.toISOString())),
  mio(sb.from('citas').select('inicio,estado,clientes(nombre),barberos(nombre)').in('estado',['PENDIENTE','CONFIRMADA']).gte('inicio',h0.toISOString()).lt('inicio',h1.toISOString())).order('inicio'),
  ADM.includes(S.perfil.rol)?sb.from('stock_actual').select('nombre,existencias,stock_minimo'):Promise.resolve({data:[]})]);
 const tot=(v||[]).reduce((a,x)=>a+Number(x.total_venta),0),bajo=(s||[]).filter(x=>Number(x.existencias)<=Number(x.stock_minimo)),prox=(c||[]).filter(x=>new Date(x.inicio)>=new Date());
 $('#main').innerHTML=`<div class="head"><h2>Hoy</h2></div>
 <div class="kp"><div><small>Vendido hoy</small><strong>${dinero(tot)}</strong></div><div><small>Ventas</small><strong>${(v||[]).length}</strong></div><div><small>Citas pendientes</small><strong>${(c||[]).length}</strong></div></div>
 <label>Próximas citas</label>${prox.length?prox.slice(0,5).map(x=>fila2(hora(x.inicio)+', '+esc(x.clientes?.nombre),esc(x.barberos?.nombre))).join(''):'<p class="empty">No hay más citas por atender hoy.</p>'}
 ${bajo.length?'<label>Stock bajo</label>'+bajo.map(x=>fila2(esc(x.nombre),x.existencias+' (mínimo '+x.stock_minimo+')')).join(''):''}`;
}
function ajustes(){
 const n=S.negocio,url=location.origin+location.pathname.replace(/[^/]*$/,'')+'reservar.html?n='+n.slug;
 $('#main').innerHTML=`<div class="head"><h2>Ajustes</h2></div><p class="mute">Plan ${esc(S.sus?.plan||'')}, vence el ${esc(S.sus?.vence_en||'')}.</p>
 <label for="ur">Enlace de reservas para tus clientes</label><input id="ur" value="${esc(url)}" readonly><button type="button" class="btn sec block" id="cp">Copiar enlace</button><button type="button" class="btn sec block" id="ct">Cuentas de recaudo (Nequi, bancos)</button>
 <form id="af"><label for="a1">Nombre de la barbería</label><input id="a1" name="nombre" value="${esc(n.nombre)}" required>
 <label for="a2">Teléfono</label><input id="a2" name="telefono" type="tel" value="${esc(n.telefono)}">
 <label for="a3">Dirección</label><input id="a3" name="direccion" value="${esc(n.direccion)}">
 <label for="a5">Valor de la cita (reserva)</label><input id="a5" name="valor_cita" type="number" min="0" inputmode="decimal" value="${esc(n.valor_cita||0)}">
 <label for="a4">Correo</label><input id="a4" name="correo" type="email" value="${esc(n.correo)}">
 <label class="chk"><input type="checkbox" name="reserva_publica"${n.reserva_publica?' checked':''}> Recibir reservas en línea</label>
 <label class="chk"><input type="checkbox" name="permitir_saldos"${n.permitir_saldos?' checked':''}> Permitir ventas con saldo pendiente (fiado)</label>
 <button class="btn block">Guardar ajustes</button></form>
 <h2 style="margin-top:32px">Equipo</h2><div id="eq">Cargando…</div><button type="button" class="btn sec block" id="iv">Invitar a alguien</button>`;
 $('#ct').onclick=()=>{S.vista='cuentas';ir()};
 $('#cp').onclick=()=>navigator.clipboard.writeText(url).then(()=>toast('Enlace copiado')).catch(()=>{$('#ur').select();toast('Mantén presionado el enlace y copia')});
 $('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),o={nombre:f.get('nombre').trim(),telefono:f.get('telefono')||null,direccion:f.get('direccion')||null,correo:f.get('correo')||null,reserva_publica:!!f.get('reserva_publica'),permitir_saldos:!!f.get('permitir_saldos'),valor_cita:Number(f.get('valor_cita'))||0};
  const{error}=await sb.from('negocios').update(o).eq('id',n.id);if(error)return toast(error.message,true);Object.assign(S.negocio,o);
  const{data:sc}=await sb.from('servicios').select('id').eq('categoria','CITA').limit(1);
  if(sc&&sc[0])await sb.from('servicios').update({precio:o.valor_cita,estado:o.valor_cita>0?'ACTIVO':'INACTIVO'}).eq('id',sc[0].id);
  else if(o.valor_cita>0)await sb.from('servicios').insert({negocio_id:S.perfil.negocio_id,nombre:'Cita (reserva)',categoria:'CITA',precio:o.valor_cita,duracion_minutos:1});
  toast('Ajustes guardados')};
 equipo();
}
